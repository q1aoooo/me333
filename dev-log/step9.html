<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>跳舞影片小工具｜第九步：逐格輸出（不卡版）</title>
<style>
  body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 24px; color: #222; }
  #stage { position: relative; display: inline-block; margin-top: 12px; }
  #stage video, #stage canvas { display: block; max-height: 80vh; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  /* 選人模式時，讓畫布可以被點擊 */
  #stage.picking canvas { pointer-events: auto; cursor: crosshair; }
  #status { margin-left: 12px; color: #666; }
  button { margin-left: 8px; }
  /* 原始影片和置中預覽並排 */
  #row { display: flex; gap: 24px; align-items: flex-start; }
  #preview { display: block; max-height: 80vh; margin-top: 12px; background: #000; }
  #controls { margin-top: 12px; line-height: 2; }
  #controls label { margin-right: 20px; }
  #download { margin-left: 12px; }
</style>
</head>
<body>
  <input type="file" id="picker" accept="video/*">
  <button id="pickBtn">選擇要追蹤的人</button>
  <button id="exportBtn">輸出影片</button>
  <span id="status">模型載入中…</span>
  <a id="download" style="display:none">下載置中影片</a>
  <!-- 可調整的設定 -->
  <div id="controls">
    <label>放大倍率 <input type="range" id="zoom" min="1" max="2" step="0.05" value="1.15"> <span id="zoomVal">1.15</span></label>
    <label>跟隨速度 <input type="range" id="follow" min="0.02" max="0.5" step="0.01" value="0.26"> <span id="followVal">0.26</span></label>
    <label><input type="checkbox" id="followY" checked> 上下也跟隨</label>
    <br>
    <!-- 濾鏡 -->
    <label>濾鏡
      <select id="filterSel">
        <option value="none">原色</option>
        <option value="fresh">清新</option>
        <option value="warm">暖色</option>
        <option value="cool">冷色</option>
        <option value="retro">復古</option>
        <option value="bw">黑白</option>
      </select>
    </label>
    <label>濾鏡強度 <input type="range" id="filterAmt" min="0" max="1" step="0.05" value="0.7"> <span id="filterAmtVal">0.7</span></label>
    <span id="filterWarn" style="color:#c33"></span>
    <br>
    <!-- 手動調整：0 是不調整，往左往右各一半 -->
    <label>曝光 <input type="range" id="adjExposure" min="-1" max="1" step="0.05" value="0"> <span id="adjExposureVal">0</span></label>
    <label>對比 <input type="range" id="adjContrast" min="-1" max="1" step="0.05" value="0"> <span id="adjContrastVal">0</span></label>
    <label>色溫 <input type="range" id="adjTemp" min="-1" max="1" step="0.05" value="0"> <span id="adjTempVal">0</span></label>
    <label>色調 <input type="range" id="adjTint" min="-1" max="1" step="0.05" value="0"> <span id="adjTintVal">0</span></label>
    <button id="resetAdj">重設調整</button>
  </div>
  <div id="row">
    <div id="stage">
      <video id="video" controls playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <!-- 置中後的預覽畫面 -->
    <canvas id="preview"></canvas>
  </div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
// 【新增】開源套件 mp4-muxer（GitHub: Vanilagy/mp4-muxer），把編好的畫面和聲音包成 mp4
import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm";

const video  = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx    = canvas.getContext("2d");
const status = document.getElementById("status");
const stage  = document.getElementById("stage");
const drawer = new DrawingUtils(ctx);

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
const pose = await PoseLandmarker.createFromOptions(vision, {
  baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
    delegate: "GPU",   // 用顯示卡來跑偵測，比較快
  },
  runningMode: "VIDEO",
  numPoses: 3,   // 最多同時偵測 3 個人
});
status.textContent = "模型載入完成，請選擇一支跳舞影片";

document.getElementById("picker").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  video.src = URL.createObjectURL(file);
  currentFile = file;   // 【新增】記住原始檔，輸出時要拿聲音
  target = null;
  status.textContent = "先暫停在看得到你的畫面，按「選擇要追蹤的人」後點你自己";
});

video.addEventListener("loadedmetadata", () => {
  // iPhone 常拍 4K，每格都處理 4K 太吃力；長邊最多縮到 1920（也就是 1080p）
  const scale = Math.min(1, 1920 / Math.max(video.videoWidth, video.videoHeight));
  // 【修改】H.264 要求寬高是偶數
  const w = Math.round(video.videoWidth * scale / 2) * 2, h = Math.round(video.videoHeight * scale / 2) * 2;
  canvas.width = w;  canvas.height = h;
  preview.width = w; preview.height = h;
  cam = { x: 0.5, y: 0.5 };
});

// ===== 置中預覽 =====
const preview = document.getElementById("preview");
const pctx = preview.getContext("2d");
const zoomEl = document.getElementById("zoom");
const followEl = document.getElementById("follow");
const followYEl = document.getElementById("followY");
zoomEl.oninput = () => document.getElementById("zoomVal").textContent = zoomEl.value;
followEl.oninput = () => document.getElementById("followVal").textContent = followEl.value;

// ===== 濾鏡 =====
// 每個濾鏡由幾個調整組成：亮度、對比、飽和度、棕褐色、色相旋轉（度）、黑白
const PRESETS = {
  none:  { brightness: 1,    contrast: 1,    saturate: 1,    sepia: 0,    hue: 0,   gray: 0 },
  fresh: { brightness: 1.08, contrast: 1.03, saturate: 1.25, sepia: 0,    hue: 0,   gray: 0 },
  warm:  { brightness: 1.03, contrast: 1.02, saturate: 1.1,  sepia: 0.25, hue: -8,  gray: 0 },
  cool:  { brightness: 1.0,  contrast: 1.06, saturate: 0.9,  sepia: 0,    hue: 12,  gray: 0 },
  retro: { brightness: 1.02, contrast: 0.95, saturate: 0.7,  sepia: 0.45, hue: 0,   gray: 0 },
  bw:    { brightness: 1.02, contrast: 1.25, saturate: 1,    sepia: 0,    hue: 0,   gray: 1 },
};
const filterSel = document.getElementById("filterSel");
const filterAmtEl = document.getElementById("filterAmt");
filterAmtEl.oninput = () => document.getElementById("filterAmtVal").textContent = filterAmtEl.value;

// 依強度在「原色」和「選的濾鏡」之間取中間值，組成瀏覽器看得懂的濾鏡字串
function filterString() {
  const p = PRESETS[filterSel.value], o = PRESETS.none;
  const k = parseFloat(filterAmtEl.value);
  const mix = key => o[key] + (p[key] - o[key]) * k;
  // 曝光和對比：乘在濾鏡的亮度、對比上（滑桿 -1～1 對應 0.5 倍～1.5 倍）
  const exposure = 1 + adj("adjExposure") * 0.5;
  const contrast = 1 + adj("adjContrast") * 0.5;
  return `brightness(${mix("brightness") * exposure}) contrast(${mix("contrast") * contrast}) saturate(${mix("saturate")}) ` +
         `sepia(${mix("sepia")}) hue-rotate(${mix("hue")}deg) grayscale(${mix("gray")})`;
}

// ===== 手動調整 =====
const ADJ_IDS = ["adjExposure", "adjContrast", "adjTemp", "adjTint"];
function adj(id) { return parseFloat(document.getElementById(id).value); }

// 暫停時調整，也要立刻更新預覽，才看得到效果
function refreshIfPaused() { if (video.paused) renderPreview(); }

ADJ_IDS.forEach(id => {
  const el = document.getElementById(id);
  el.oninput = () => { document.getElementById(id + "Val").textContent = el.value; refreshIfPaused(); };
});
document.getElementById("resetAdj").onclick = () => {
  ADJ_IDS.forEach(id => { document.getElementById(id).value = 0; document.getElementById(id + "Val").textContent = "0"; });
  refreshIfPaused();
};
filterSel.onchange = refreshIfPaused;
filterAmtEl.addEventListener("input", refreshIfPaused);

// 色溫、色調：像在畫面上蓋一層有顏色的透明玻璃紙，用「柔光」混合讓顏色自然地滲進去
function applyColorShift() {
  const temp = adj("adjTemp"), tint = adj("adjTint");
  pctx.save();
  pctx.globalCompositeOperation = "soft-light";
  if (temp !== 0) {
    // 往右偏暖（橘色），往左偏冷（藍色）
    pctx.fillStyle = temp > 0 ? "rgb(255,150,40)" : "rgb(40,130,255)";
    pctx.globalAlpha = Math.abs(temp) * 0.6;
    pctx.fillRect(0, 0, preview.width, preview.height);
  }
  if (tint !== 0) {
    // 往右偏洋紅，往左偏綠
    pctx.fillStyle = tint > 0 ? "rgb(255,40,200)" : "rgb(40,220,80)";
    pctx.globalAlpha = Math.abs(tint) * 0.5;
    pctx.fillRect(0, 0, preview.width, preview.height);
  }
  pctx.restore();
}

// 有些舊版瀏覽器的畫布不支援濾鏡，先提醒
if (!("filter" in pctx)) {
  document.getElementById("filterWarn").textContent = "這個瀏覽器不支援濾鏡，請改用新版 Chrome";
}

// 「鏡頭」目前對準的位置（比例座標），會慢慢追向人的身體中心
let cam = { x: 0.5, y: 0.5 };

function renderPreview() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const zoom = parseFloat(zoomEl.value);
  const k = parseFloat(followEl.value);

  // 平滑：每一格只往目標移動一小段，數字越大跟得越快、越不平滑
  if (target) {
    cam.x += (target.x - cam.x) * k;
    if (followYEl.checked) cam.y += (target.y - cam.y) * k;
  }

  // 放大後要擷取的範圍（寬高都縮小成 1/zoom）
  const cw = vw / zoom, ch = vh / zoom;
  // 讓鏡頭中心對準人，但不能超出原影片邊界
  let cx = cam.x * vw - cw / 2;
  let cy = (followYEl.checked ? cam.y : 0.5) * vh - ch / 2;
  cx = Math.max(0, Math.min(vw - cw, cx));
  cy = Math.max(0, Math.min(vh - ch, cy));

  pctx.filter = filterString();   // 套上濾鏡
  pctx.drawImage(video, cx, cy, cw, ch, 0, 0, preview.width, preview.height);
  pctx.filter = "none";
  applyColorShift();   // 最後再調色溫、色調
}

// 身體中心（可以改成你上一步選的點）
const CENTER_IDS = [11, 12, 23, 24];
function bodyCenter(lm) {
  const x = CENTER_IDS.reduce((s, i) => s + lm[i].x, 0) / CENTER_IDS.length;
  const y = CENTER_IDS.reduce((s, i) => s + lm[i].y, 0) / CENTER_IDS.length;
  return { x, y };
}

// 兩個點之間的距離（比例座標）
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// 要追蹤的人：記住他上一格的身體中心
let target = null;
// 一格之內最多能移動多遠，超過就當作「跟丟了」
const MAX_JUMP = 0.15;

let people = [];   // 這一格偵測到的所有人

// 在人群中找出離 target 最近的那個人
function findTarget() {
  if (!target || people.length === 0) return -1;
  let best = -1, bestD = Infinity;
  people.forEach((lm, i) => {
    const d = dist(bodyCenter(lm), target);
    if (d < bestD) { bestD = d; best = i; }
  });
  return bestD < MAX_JUMP ? best : -1;
}

function detect() {
  const result = pose.detectForVideo(video, performance.now());
  people = result.landmarks;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const idx = findTarget();
  people.forEach((lm, i) => {
    const isTarget = i === idx;
    // 追蹤中的人畫粉紅色，其他人畫淡灰色
    drawer.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS,
      { color: isTarget ? "#ff4d8d" : "rgba(255,255,255,0.35)", lineWidth: isTarget ? 4 : 2 });
  });
  if (idx >= 0) {
    target = bodyCenter(people[idx]);   // 更新位置，下一格用
    ctx.fillStyle = "#ffd400";
    ctx.beginPath();
    ctx.arc(target.x * canvas.width, target.y * canvas.height, 12, 0, Math.PI * 2);
    ctx.fill();
  } else if (target) {
    status.textContent = "這一格跟丟了，可以暫停後重新選人";
  }
}

// 選人：按按鈕進入選人模式，點畫面上的人
document.getElementById("pickBtn").addEventListener("click", () => {
  video.pause();
  detect();
  target = null;
  draw();
  stage.classList.add("picking");
  status.textContent = "點一下你要追蹤的人";
});

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const click = { x: (e.clientX - rect.left) / rect.width,
                  y: (e.clientY - rect.top) / rect.height };
  // 選離點擊位置最近的人
  let best = null, bestD = Infinity;
  people.forEach((lm) => {
    const d = dist(bodyCenter(lm), click);
    if (d < bestD) { bestD = d; best = bodyCenter(lm); }
  });
  if (best) {
    target = best;
    cam = { ...best };   // 選好人時鏡頭直接對準，不用慢慢滑過去
    picked = { time: video.currentTime, pos: { ...best } };   // 記住在哪個時間點選了誰，輸出時從這裡開始
    stage.classList.remove("picking");
    status.textContent = "已選好，按播放開始追蹤";
    draw();
    renderPreview();
  }
});

// ===== 【修改】逐格輸出影片 =====
// 不再邊播邊錄，而是一格一格處理：跳到那一格 → 偵測 → 置中、濾鏡 → 交給編碼器
// 比較慢，但每一格都一定會被處理到，輸出的影片不會卡
const FPS = 30;          // 輸出的每秒格數
let picked = null;       // { time: 選人的時間, pos: 當時的位置 }
let exporting = false;   // 輸出中時，暫停一般的預覽更新
let currentFile = null;  // 原始影片檔，拿聲音用

// 跳到某個時間，等畫面準備好再繼續（最多等 1 秒，避免卡住）
function seekTo(t) {
  return new Promise(resolve => {
    const timer = setTimeout(resolve, 1000);
    video.addEventListener("seeked", () => { clearTimeout(timer); resolve(); }, { once: true });
    video.currentTime = t;
  });
}

// 找瀏覽器支援的 H.264 設定（剪映、Wink 都讀得了）
async function pickVideoConfig(w, h) {
  for (const codec of ["avc1.640028", "avc1.4d0028", "avc1.42e028"]) {
    const cfg = { codec, width: w, height: h, bitrate: 8_000_000, framerate: FPS };
    if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg;
  }
  return null;
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  if (!picked) { status.textContent = "請先選擇要追蹤的人"; return; }
  if (exporting) return;
  if (!("VideoEncoder" in window)) { status.textContent = "這個瀏覽器不支援逐格輸出，請用新版 Chrome"; return; }
  exporting = true;
  video.pause();
  document.getElementById("download").style.display = "none";

  const W = preview.width, H = preview.height;
  const vcfg = await pickVideoConfig(W, H);
  if (!vcfg) { status.textContent = "找不到可用的影片編碼設定"; exporting = false; return; }

  // 1. 把原影片的聲音解出來，準備編成 AAC（mp4 常用的聲音格式）
  let audioBuf = null, acfg = null;
  try {
    const actx = new AudioContext();
    audioBuf = await actx.decodeAudioData(await currentFile.arrayBuffer());
    actx.close();
    const cfg = { codec: "mp4a.40.2", sampleRate: audioBuf.sampleRate,
                  numberOfChannels: Math.min(2, audioBuf.numberOfChannels), bitrate: 128_000 };
    if ((await AudioEncoder.isConfigSupported(cfg)).supported) acfg = cfg;
  } catch (err) { console.warn("讀不到聲音", err); }

  // 2. 準備 mp4 封裝器（開源套件 mp4-muxer）和影片編碼器
  const muxer = new Muxer({
    target: new ArrayBufferTarget(),
    video: { codec: "avc", width: W, height: H },
    audio: acfg ? { codec: "aac", sampleRate: acfg.sampleRate, numberOfChannels: acfg.numberOfChannels } : undefined,
    fastStart: "in-memory",
  });
  const venc = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: e => console.error(e),
  });
  venc.configure(vcfg);

  // 3. 一格一格處理：從選人的時間點開始，到影片結尾
  target = { ...picked.pos };
  cam = { ...picked.pos };
  const start = picked.time;
  const total = Math.floor((video.duration - start) * FPS);
  for (let i = 0; i < total; i++) {
    await seekTo(start + i / FPS);
    if (i % DETECT_EVERY === 0) { detect(); draw(); }
    renderPreview();
    const frame = new VideoFrame(preview, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    venc.encode(frame, { keyFrame: i % (FPS * 2) === 0 });   // 每 2 秒放一個關鍵格，剪輯軟體拖拉比較順
    frame.close();
    status.textContent = `輸出中… ${Math.round((i + 1) / total * 100)}%`;
  }
  await venc.flush();

  // 4. 聲音：從選人的時間點切出對應長度，分段編碼
  if (acfg) {
    const aenc = new AudioEncoder({
      output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
      error: e => console.error(e),
    });
    aenc.configure(acfg);
    const sr = audioBuf.sampleRate, ch = acfg.numberOfChannels;
    const s0 = Math.floor(start * sr);
    const s1 = Math.min(audioBuf.length, s0 + Math.floor(total / FPS * sr));
    const CHUNK = 4096;
    for (let pos = s0; pos < s1; pos += CHUNK) {
      const n = Math.min(CHUNK, s1 - pos);
      const data = new Float32Array(n * ch);
      for (let c = 0; c < ch; c++) data.set(audioBuf.getChannelData(c).subarray(pos, pos + n), c * n);
      const ad = new AudioData({ format: "f32-planar", sampleRate: sr, numberOfFrames: n,
                                 numberOfChannels: ch, timestamp: Math.round((pos - s0) / sr * 1e6), data });
      aenc.encode(ad);
      ad.close();
    }
    await aenc.flush();
  }

  // 5. 封裝成 mp4，產生下載連結
  muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: "video/mp4" });
  const link = document.getElementById("download");
  link.href = URL.createObjectURL(blob);
  link.download = "置中影片.mp4";
  link.style.display = "inline";
  status.textContent = acfg ? "輸出完成！" : "輸出完成（這支影片的聲音讀不到，輸出的是無聲版本）";
  exporting = false;
});

// 每一格影片畫面都更新預覽，但偵測姿勢比較花時間，每隔幾格才做一次
// 反正鏡頭本來就會平滑移動，不用每一格都知道人在哪裡
const DETECT_EVERY = 2;   // 每 2 格偵測一次；還是卡的話可以改成 3
let frameCount = 0;
function onVideoFrame() {
  if (exporting) { video.requestVideoFrameCallback(onVideoFrame); return; }   // 【新增】輸出中交給逐格流程處理
  frameCount++;
  if (frameCount % DETECT_EVERY === 0 || people.length === 0) {
    detect();
    draw();
  }
  renderPreview();
  video.requestVideoFrameCallback(onVideoFrame);   // 等下一格影片畫面出現再呼叫
}
video.requestVideoFrameCallback(onVideoFrame);
</script>
</body>
</html>
