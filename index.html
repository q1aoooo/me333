<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ME<333｜影片人物自動置中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== 風格：黑白小誌感 + 灰色波點 + 星號與翅膀 ===== */
  :root {
    --paper: #FFFFFF;
    --ink: #111111;        /* 主色：黑 */
    --muted: #6E6E6E;      /* 次要文字：灰 */
    --dot: #D6D6D6;        /* 背景波點 */
    --soft: #F2F2F2;       /* 淺灰底 */
    --accent: #111111;     /* 想加一點顏色的話，改這裡就好（例如淡粉 #F7C6D9） */
    --shadow: 4px 4px 0 var(--ink);   /* 像貼紙一樣的硬陰影 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 15px; line-height: 1.6;
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px);   /* 波點 */
    background-size: 22px 22px;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }

  /* ===== 上方 ===== */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 32px 6px; max-width: 1500px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .wordmark {
    margin: 0; font-family: "Anton", "Impact", sans-serif; font-weight: 400;
    font-size: 46px; line-height: 1; letter-spacing: 0.01em;
  }
  .wordmark sup { font-size: 0.55em; vertical-align: 0.9em; margin-left: 1px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  #status {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
    padding: 5px 14px; font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  body.exporting #status { background: var(--ink); color: var(--paper); }

  /* 步驟列 */
  .topbar { display: flex; align-items: center; justify-content: flex-start; gap: 12px 20px; flex-wrap: wrap;
            margin: 14px auto 22px; padding: 0 32px; max-width: 1500px; }
  .steps { list-style: none; display: flex; gap: 10px; flex-wrap: wrap; margin: 0; padding: 0; }
  .steps li {
    display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px;
    border-radius: 999px; background: var(--paper); border: 2px solid var(--ink);
    font-size: 14px; font-weight: 500; color: var(--muted);
  }
  .steps li span {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid var(--ink); color: var(--ink); font-weight: 700; font-size: 12px;
  }
  .steps li.now { background: var(--ink); color: var(--paper); box-shadow: var(--shadow); }
  .steps li.now span { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .steps li.done span { background: var(--ink); color: var(--paper); }
  .steps li.done::after { content: "*"; font-family: "Anton", sans-serif; color: var(--ink); }

  /* ===== 主要區域 ===== */
  /* 版面：上面一排工具，下面兩張一樣大的小卡，右邊設定面板 */
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 340px;
    column-gap: 36px; row-gap: 18px;
    padding: 0 32px 48px; align-items: start; max-width: 1500px; margin: 0 auto;
  }
  .toolbar { display: none; align-items: center; gap: 10px; padding-left: 20px; border-left: 2px dotted var(--ink); }   /* 用點點線和步驟分開 */
  body.has-video .toolbar { display: flex; }
  .toolbar #fileName { margin-left: 6px; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside { grid-column: 3; }

  /* 兩張小卡：同樣的白框、黑邊、硬陰影、下方標籤 */
  .frame {
    display: none; margin: 0; justify-self: center; width: fit-content; max-width: 100%;
    background: var(--paper); padding: 12px 12px 42px; position: relative;
    border: 2px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow);
  }
  body.has-video .frame { display: block; }
  .frame figcaption {
    position: absolute; left: 14px; right: 14px; bottom: 10px;
    display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 700;
  }
  .frame figcaption b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 16px; letter-spacing: .02em; }
  /* 兩邊的畫面用同一個最大高度，大小就會一樣 */
  .frame video, .frame #preview { display: block; width: auto; height: auto; max-width: 100%; max-height: max(420px, calc(100vh - 250px));   /* 讓整張小卡在一個畫面內看得完 */ border-radius: 8px; background: #111; }

  /* 還沒選影片時：拖放區 */
  #dropzone {
    grid-column: 1 / 3; min-height: 60vh; border: 2px dashed var(--ink); border-radius: 18px;
    background: var(--paper); display: grid; place-content: center; text-align: center;
    padding: 40px; cursor: pointer;
  }
  #dropzone.over { background: var(--soft); border-style: solid; }
  #dropzone strong { display: block; font-size: 24px; font-weight: 900; margin-bottom: 4px; }
  #dropzone .pick { justify-self: center; margin: 18px 0 12px; }
  #dropzone small { color: var(--muted); }
  body:not(.ready) #dropzone { opacity: .5; pointer-events: none; }
  body.has-video #dropzone { display: none; }
  body:not(.has-video) aside { opacity: .4; pointer-events: none; }

  .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; min-height: 38px; }
  .pane-head h2 { margin: 0; font-size: 16px; font-weight: 900; background: var(--paper); padding: 0 4px; }
  #fileName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 原始畫面 */
  /* 原始畫面也跟著影片大小，和右邊的小卡一樣不留黑邊 */
  #stage { position: relative; border-radius: 8px; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #stage.picking canvas { pointer-events: auto; cursor: crosshair; }
  #stage.picking { box-shadow: var(--shadow); outline: 3px dashed var(--ink); outline-offset: 4px; }


  /* ===== 右側設定面板 ===== */
  aside {
    position: sticky; top: 20px; background: var(--paper); border: 2px solid var(--ink);
    border-radius: 16px; box-shadow: var(--shadow); padding: 4px 22px 20px;
    max-height: calc(100vh - 40px); overflow-y: auto;
  }
  aside section { padding: 14px 0; border-bottom: 2px dotted var(--ink); }
  aside section:last-child { border-bottom: 0; padding-bottom: 0; }
  aside h3 { margin: 0 0 8px; font-size: 15px; font-weight: 900; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; margin: 4px 0; }
  .row output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .row input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 6px 0 8px; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: var(--dot); cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
  input.bipolar {   /* 中間 0 的刻度 */
    background: linear-gradient(to right, var(--dot) calc(50% - 1px), var(--ink) calc(50% - 1px),
                var(--ink) calc(50% + 1px), var(--dot) calc(50% + 1px));
  }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .check input { accent-color: var(--ink); width: 16px; height: 16px; }

  /* 濾鏡選項 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label {
    display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px;
    border: 2px solid var(--ink); border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .chips label i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--ink); }
  .chips input:checked + label { background: var(--ink); color: var(--paper); }
  .chips input:checked + label i { border-color: var(--paper); }
  .chips input:focus-visible + label { outline: 3px dashed var(--ink); outline-offset: 2px; }
  #filterWarn { color: var(--ink); font-size: 13px; font-weight: 700; }

  /* 按鈕 */
  .btn {
    border: 2px solid var(--ink); background: var(--paper); border-radius: 999px;
    padding: 6px 16px; cursor: pointer; font-weight: 700;
  }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--dot); }
  .btn.primary:hover { background: #2a2a2a; }
  .btn.primary:active { transform: translate(2px, 2px); box-shadow: none; }
  .btn.big { width: 100%; padding: 12px; font-size: 17px; }
  .btn.small { padding: 3px 12px; font-size: 13px; }
  body.exporting #exportBtn { opacity: .5; pointer-events: none; }

  /* 輸出進度 */
  .progress { height: 10px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; margin-top: 12px; display: none; }
  body.exporting .progress { display: block; }
  #progressBar { height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  #download { display: block; text-align: center; margin-top: 12px; text-decoration: none; }
  #download[hidden] { display: none; }
  .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .hint-line { color: var(--muted); font-size: 12px; margin: -4px 0 6px; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; }
  .keys .key { display: inline-flex; align-items: center; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .keys .key button { border: 0; background: none; cursor: pointer; font: inherit; font-size: 13px; padding: 2px 8px; }
  .keys .key button + button { border-left: 2px solid var(--ink); font-weight: 700; }
  .keys .key button:hover { background: var(--soft); }
  .keys .empty { color: var(--muted); font-size: 13px; }
  .keys .key.pick { background: var(--ink); }
  .keys .key.pick button { color: var(--paper); }
  .keys .key.pick button + button { border-left-color: var(--paper); }
  .keys .key.pick button:hover { background: #333; }
  #preview { cursor: ns-resize; touch-action: none; }   /* 可以在預覽上拖曳調整上下 */

  /* ===== 小螢幕 ===== */
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr 1fr; }
    aside { grid-column: 1 / -1; grid-row: auto; position: static; max-height: none; }
  }
  @media (max-width: 700px) {
    header, .topbar, main { padding-left: 16px; padding-right: 16px; }
    main { grid-template-columns: 1fr; }
    .toolbar { flex-wrap: wrap; }
    #dropzone { grid-column: 1; }
      .wordmark { font-size: 38px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div>
        <h1 class="wordmark">ME&lt;333<sup>*</sup></h1>
      </div>
    </div>
    <div id="status" role="status">模型載入中…</div>
  </header>

  <!-- 步驟和工具按鈕放在同一行 -->
  <div class="topbar">
    <ol class="steps">
      <li class="now"><span>1</span>選影片</li>
      <li><span>2</span>點選人物</li>
      <li><span>3</span>調整畫面</li>
      <li><span>4</span>輸出</li>
    </ol>
    <div class="toolbar">
      <button id="pickBtn" class="btn">點選要追蹤的人</button>
      <label for="picker" class="btn">換一支影片</label>
      <span id="fileName"></span>
    </div>
  </div>

  <main>
    <!-- 還沒選影片時的拖放區 -->
    <label id="dropzone" for="picker">
      <strong>把影片拖進來 *</strong>
      <span>跳舞、偶像影片都可以，多人同框時點一下想追蹤的人就好</span>
      <span class="btn primary pick">選擇影片</span>
      <small>影片只在你的電腦上處理，不會上傳到任何地方</small>
    </label>
    <input type="file" id="picker" accept="video/*" hidden>

    <!-- 原始畫面 -->
    <figure class="frame source">
      <div id="stage">
        <video id="video" controls playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <figcaption><span>原始畫面</span><b>ME</b></figcaption>
    </figure>

    <figure class="frame result">
      <canvas id="preview"></canvas>
      <figcaption><span>置中預覽</span><b>&lt;333*</b></figcaption>
    </figure>

    <!-- 設定面板 -->
    <aside>
      <section>
        <h3>畫面比例</h3>
        <!-- 選輸出的裁切比例 -->
        <div class="chips">
          <input type="radio" name="ratio" id="r-orig" value="orig" checked><label for="r-orig">原比例</label>
          <input type="radio" name="ratio" id="r-916" value="0.5625"><label for="r-916">9:16</label>
          <input type="radio" name="ratio" id="r-11" value="1"><label for="r-11">1:1</label>
          <input type="radio" name="ratio" id="r-34" value="0.75"><label for="r-34">3:4</label>
        </div>
      </section>

      <section>
        <h3>追蹤</h3>
        <!-- 最多偵測幾個人 -->
        <!-- 準確模式 -->
        <label class="check"><input type="checkbox" id="accurate"> 準確模式（骨架比較穩，但比較慢）</label>
        <div class="row"><label for="zoom">放大倍率</label><output id="zoomVal">1.15</output>
          <input type="range" id="zoom" min="1" max="2" step="0.05" value="1.15"></div>
        <!-- 人在畫面裡偏上或偏下 -->
        <div class="row"><label for="offsetY">人物上下位置</label><output id="offsetYVal">0</output>
          <input type="range" class="bipolar" id="offsetY" min="-1" max="1" step="0.05" value="0"></div>
        <p class="hint-line">往左人會偏上，往右人會偏下；也可以直接在右邊預覽畫面上下拖曳</p>
        <div class="row"><label for="follow">跟隨速度</label><output id="followVal">0.08</output>
          <input type="range" id="follow" min="0.02" max="0.5" step="0.01" value="0.08"></div>
        <label class="check"><input type="checkbox" id="followY" checked> 上下也跟隨</label>
      </section>

      <!-- 手動關鍵影格 -->
      <section>
        <div class="pane-head" style="min-height:0; margin-bottom:4px">
          <h3 style="margin:0">手動關鍵影格</h3>
          <button id="addKey" class="btn small">＋ 加在這裡</button>
        </div>
        <p class="hint-line">人物還沒出現或跟丟的片段，畫面會照這裡的關鍵影格移動，沒有關鍵影格就停在原地。暫停後在預覽畫面上拖曳，調好位置再按「加在這裡」</p>
        <div id="keyList" class="keys"></div>
      </section>

      <section>
        <h3>濾鏡</h3>
        <div class="chips">
          <input type="radio" name="filter" id="f-none" value="none" checked><label for="f-none"><i style="background:#D9D4E6"></i>原色</label>
          <input type="radio" name="filter" id="f-fresh" value="fresh"><label for="f-fresh"><i style="background:#7FDCC2"></i>清新</label>
          <input type="radio" name="filter" id="f-warm" value="warm"><label for="f-warm"><i style="background:#FFB25E"></i>暖色</label>
          <input type="radio" name="filter" id="f-cool" value="cool"><label for="f-cool"><i style="background:#7FA8FF"></i>冷色</label>
          <input type="radio" name="filter" id="f-retro" value="retro"><label for="f-retro"><i style="background:#B98E6B"></i>復古</label>
          <input type="radio" name="filter" id="f-bw" value="bw"><label for="f-bw"><i style="background:#232544"></i>黑白</label>
        </div>
        <div class="row"><label for="filterAmt">濾鏡強度</label><output id="filterAmtVal">0.7</output>
          <input type="range" id="filterAmt" min="0" max="1" step="0.05" value="0.7"></div>
        <span id="filterWarn"></span>
      </section>

      <section>
        <div class="pane-head" style="min-height:0; margin-bottom:4px">
          <h3 style="margin:0">調整</h3>
          <button id="resetAdj" class="btn small">重設</button>
        </div>
        <div class="row"><label for="adjExposure">曝光</label><output id="adjExposureVal">0</output>
          <input type="range" class="bipolar" id="adjExposure" min="-1" max="1" step="0.05" value="0"></div>
        <div class="row"><label for="adjContrast">對比</label><output id="adjContrastVal">0</output>
          <input type="range" class="bipolar" id="adjContrast" min="-1" max="1" step="0.05" value="0"></div>
        <div class="row"><label for="adjTemp">色溫</label><output id="adjTempVal">0</output>
          <input type="range" class="bipolar" id="adjTemp" min="-1" max="1" step="0.05" value="0"></div>
        <div class="row"><label for="adjTint">色調</label><output id="adjTintVal">0</output>
          <input type="range" class="bipolar" id="adjTint" min="-1" max="1" step="0.05" value="0"></div>
      </section>

      <section>
        <button id="exportBtn" class="btn primary big">輸出影片</button>
        <div class="progress"><div id="progressBar"></div></div>
        <a id="download" class="btn" hidden>下載置中影片</a>
        <p class="note">從點選人物的那一刻開始輸出到結尾，會一格一格處理，請等進度跑完。</p>
      </section>
    </aside>
  </main>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
// 開源套件 mp4-muxer（GitHub: Vanilagy/mp4-muxer），把編好的畫面和聲音包成 mp4
import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm";

const video  = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx    = canvas.getContext("2d");
const status = document.getElementById("status");
const stage  = document.getElementById("stage");
const drawer = new DrawingUtils(ctx);

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
// 兩種模型：lite 比較快，full 比較準、骨架比較不會亂跳
const MODELS = {
  lite: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
  full: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
};
function createPose(kind, numPoses) {
  return PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MODELS[kind], delegate: "GPU" },   // 用顯示卡來跑偵測，比較快
    runningMode: "VIDEO",
    numPoses,   // 最多同時偵測幾個人，可以在設定裡改
  });
}
// 目前先專注在人數不多的影片（最多同時偵測 3 人），多人團體影片之後再優化
const MAX_PEOPLE = 3;
let pose = await createPose("lite", MAX_PEOPLE);
status.textContent = "準備好了";
document.body.classList.add("ready");

// 選檔和拖曳進來都走同一個函式
function loadFile(file) {
  if (!file || !file.type.startsWith("video")) { status.textContent = "請選擇影片檔"; return; }
  video.src = URL.createObjectURL(file);
  currentFile = file;   // 記住原始檔，輸出時要拿聲音
  target = null; picks = []; activePick = -1; lostSince = null; lostCam = null;
  keyframes = []; manualEdit = false; renderKeys();   // 換影片就清空關鍵影格
  document.body.classList.add("has-video");
  document.getElementById("fileName").textContent = file.name;
  document.getElementById("download").hidden = true;
  setStep(2);
  status.textContent = "暫停在看得到那個人的畫面，按「點選要追蹤的人」";
}
document.getElementById("picker").addEventListener("change", e => loadFile(e.target.files[0]));
const drop = document.getElementById("dropzone");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => loadFile(e.dataTransfer.files[0]));

// 上方步驟列：目前走到第幾步
function setStep(n) {
  document.querySelectorAll(".steps li").forEach((li, i) => {
    li.classList.toggle("done", i + 1 < n);
    li.classList.toggle("now", i + 1 === n);
  });
}

video.addEventListener("loadedmetadata", () => {
  // iPhone 常拍 4K，每格都處理 4K 太吃力；長邊最多縮到 1920（也就是 1080p）
  const scale = Math.min(1, 1920 / Math.max(video.videoWidth, video.videoHeight));
  // H.264 要求寬高是偶數
  const w = Math.round(video.videoWidth * scale / 2) * 2, h = Math.round(video.videoHeight * scale / 2) * 2;
  canvas.width = w;  canvas.height = h;
  setOutputSize();   // 輸出畫面的大小改由「畫面比例」決定
  cam = { x: 0.5, y: 0.5 };
});

// ===== 畫面比例 =====
// 回傳要的「寬 ÷ 高」；選原比例就用影片本身的比例
function targetRatio() {
  const v = document.querySelector('input[name="ratio"]:checked').value;
  return v === "orig" ? video.videoWidth / video.videoHeight : parseFloat(v);
}

// 在原影片裡，能框出這個比例的最大範圍（還沒放大前）
function baseCrop() {
  const vw = video.videoWidth, vh = video.videoHeight, r = targetRatio();
  return (vw / vh > r) ? { w: vh * r, h: vh }   // 影片比較寬：高度用滿，左右裁掉
                       : { w: vw, h: vw / r };  // 影片比較窄：寬度用滿，上下裁掉
}

// 依比例設定輸出畫面的大小（長邊最多 1920，寬高保持偶數）
function setOutputSize() {
  if (!video.videoWidth) return;
  const b = baseCrop();
  const scale = Math.min(1, 1920 / Math.max(b.w, b.h));
  preview.width = Math.round(b.w * scale / 2) * 2;
  preview.height = Math.round(b.h * scale / 2) * 2;
}

// ===== 置中預覽 =====
const preview = document.getElementById("preview");
const pctx = preview.getContext("2d");
const zoomEl = document.getElementById("zoom");
const followEl = document.getElementById("follow");
const followYEl = document.getElementById("followY");
zoomEl.oninput = () => document.getElementById("zoomVal").textContent = zoomEl.value;
followEl.oninput = () => document.getElementById("followVal").textContent = followEl.value;

// ===== 濾鏡 =====
// 每個濾鏡由幾個調整組成：亮度、對比、飽和度、棕褐色、色相旋轉（度）、黑白
const PRESETS = {
  none:  { brightness: 1,    contrast: 1,    saturate: 1,    sepia: 0,    hue: 0,   gray: 0 },
  fresh: { brightness: 1.08, contrast: 1.03, saturate: 1.25, sepia: 0,    hue: 0,   gray: 0 },
  warm:  { brightness: 1.03, contrast: 1.02, saturate: 1.1,  sepia: 0.25, hue: -8,  gray: 0 },
  cool:  { brightness: 1.0,  contrast: 1.06, saturate: 0.9,  sepia: 0,    hue: 12,  gray: 0 },
  retro: { brightness: 1.02, contrast: 0.95, saturate: 0.7,  sepia: 0.45, hue: 0,   gray: 0 },
  bw:    { brightness: 1.02, contrast: 1.25, saturate: 1,    sepia: 0,    hue: 0,   gray: 1 },
};
// 濾鏡改成一排可以點的選項
function currentFilter() { return document.querySelector('input[name="filter"]:checked').value; }
const filterAmtEl = document.getElementById("filterAmt");
filterAmtEl.oninput = () => document.getElementById("filterAmtVal").textContent = filterAmtEl.value;

// 依強度在「原色」和「選的濾鏡」之間取中間值，組成瀏覽器看得懂的濾鏡字串
// 先算出這次要用的各項數值，Chrome 和 Safari 兩種做法都用它
function filterParams() {
  const p = PRESETS[currentFilter()], o = PRESETS.none;
  const k = parseFloat(filterAmtEl.value);
  const mix = key => o[key] + (p[key] - o[key]) * k;
  // 曝光和對比：乘在濾鏡的亮度、對比上（滑桿 -1～1 對應 0.5 倍～1.5 倍）
  return {
    brightness: mix("brightness") * (1 + adj("adjExposure") * 0.5),
    contrast:   mix("contrast")   * (1 + adj("adjContrast") * 0.5),
    saturate: mix("saturate"), sepia: mix("sepia"), hue: mix("hue"), gray: mix("gray"),
  };
}

function filterString() {
  const f = filterParams();
  return `brightness(${f.brightness}) contrast(${f.contrast}) saturate(${f.saturate}) ` +
         `sepia(${f.sepia}) hue-rotate(${f.hue}deg) grayscale(${f.gray})`;
}

// ===== 給 Safari 用的濾鏡：自己一個一個像素算顏色 =====
// 每種調整都可以寫成一個「顏色轉換表」（3×3 的矩陣 + 加減的數值），
// 把它們依序疊起來，最後每個像素只要算一次就好
function colorMatrix() {
  const f = filterParams();
  let M = [1,0,0, 0,1,0, 0,0,1], O = [0,0,0];   // 一開始是「不改變」
  // 疊上一個新的轉換：新顏色 = m × 舊顏色 + o
  const apply = (m, o = [0,0,0]) => {
    const N = new Array(9), P = new Array(3);
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) N[r*3+c] = m[r*3]*M[c] + m[r*3+1]*M[3+c] + m[r*3+2]*M[6+c];
      P[r] = m[r*3]*O[0] + m[r*3+1]*O[1] + m[r*3+2]*O[2] + o[r];
    }
    M = N; O = P;
  };
  const mixWithIdentity = (m, a) => m.map((v, i) => (i % 4 === 0 ? 1 : 0) * (1 - a) + v * a);
  const b = f.brightness; apply([b,0,0, 0,b,0, 0,0,b]);                                   // 亮度
  const c = f.contrast, co = 127.5 * (1 - c); apply([c,0,0, 0,c,0, 0,0,c], [co,co,co]);   // 對比
  const sa = f.saturate;                                                                    // 飽和度
  apply([0.213+0.787*sa, 0.715-0.715*sa, 0.072-0.072*sa,
         0.213-0.213*sa, 0.715+0.285*sa, 0.072-0.072*sa,
         0.213-0.213*sa, 0.715-0.715*sa, 0.072+0.928*sa]);
  apply(mixWithIdentity([0.393,0.769,0.189, 0.349,0.686,0.168, 0.272,0.534,0.131], f.sepia));   // 偏棕
  const h = f.hue * Math.PI / 180, cs = Math.cos(h), sn = Math.sin(h);                      // 色相
  apply([0.213+cs*0.787-sn*0.213, 0.715-cs*0.715-sn*0.715, 0.072-cs*0.072+sn*0.928,
         0.213-cs*0.213+sn*0.143, 0.715+cs*0.285+sn*0.140, 0.072-cs*0.072-sn*0.283,
         0.213-cs*0.213-sn*0.787, 0.715-cs*0.715+sn*0.715, 0.072+cs*0.928+sn*0.072]);
  apply(mixWithIdentity([0.2126,0.7152,0.0722, 0.2126,0.7152,0.0722, 0.2126,0.7152,0.0722], f.gray));   // 黑白
  return { M, O };
}

function applyFilterByPixels() {
  const { M, O } = colorMatrix();
  const isIdentity = M.every((v, i) => Math.abs(v - (i % 4 === 0 ? 1 : 0)) < 1e-3) && O.every(v => Math.abs(v) < 0.5);
  if (isIdentity) return;   // 沒有要調整就跳過，省時間
  const img = pctx.getImageData(0, 0, preview.width, preview.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2];
    d[i]   = M[0]*r + M[1]*g + M[2]*b + O[0];   // 超出 0～255 的會自動被截掉
    d[i+1] = M[3]*r + M[4]*g + M[5]*b + O[1];
    d[i+2] = M[6]*r + M[7]*g + M[8]*b + O[2];
  }
  pctx.putImageData(img, 0, 0);
}

// ===== 手動調整 =====
const ADJ_IDS = ["adjExposure", "adjContrast", "adjTemp", "adjTint"];
function adj(id) { return parseFloat(document.getElementById(id).value); }

// 暫停時調整，也要立刻更新預覽，才看得到效果
function refreshIfPaused() { if (video.paused) renderPreview(); }

ADJ_IDS.forEach(id => {
  const el = document.getElementById(id);
  el.oninput = () => { document.getElementById(id + "Val").textContent = el.value; refreshIfPaused(); };
});
document.getElementById("resetAdj").onclick = () => {
  ADJ_IDS.forEach(id => { document.getElementById(id).value = 0; document.getElementById(id + "Val").textContent = "0"; });
  refreshIfPaused();
};
document.querySelectorAll('input[name="filter"]').forEach(r => r.onchange = refreshIfPaused);
// 換比例時，重新設定輸出大小並更新預覽
document.querySelectorAll('input[name="ratio"]').forEach(r => r.onchange = () => { setOutputSize(); refreshIfPaused(); });

// 切換準確模式：換成比較大的模型重新建立偵測器
document.getElementById("accurate").addEventListener("change", async (e) => {
  status.textContent = "切換模型中…";
  const old = pose;
  pose = await createPose(e.target.checked ? "full" : "lite", MAX_PEOPLE);
  old.close();
  status.textContent = e.target.checked ? "已切換到準確模式" : "已切換回一般模式";
  if (video.paused && video.videoWidth) { detect(); draw(); }
});

// ===== 人物上下位置 =====
const offsetEl = document.getElementById("offsetY");
function showOffset() { document.getElementById("offsetYVal").textContent = offsetEl.value; }
offsetEl.addEventListener("input", () => { showOffset(); refreshIfPaused(); });

// 在預覽畫面上按住上下拖曳，也能調整（往下拖，人就往下移）
let dragFrom = null;
preview.addEventListener("pointerdown", e => {
  // 沒在追蹤人物時，拖曳是直接移動鏡頭（上下左右都可以），用來設定關鍵影格
  const manual = !isTrackingNow();
  dragFrom = { x: e.clientX, y: e.clientY, v: parseFloat(offsetEl.value), cam: { ...cam }, manual };
  if (manual) manualEdit = true;
  preview.setPointerCapture(e.pointerId);
});
preview.addEventListener("pointermove", e => {
  if (!dragFrom) return;
  if (dragFrom.manual) {
    const r = preview.getBoundingClientRect();
    const clamp = (v, half) => Math.max(half, Math.min(1 - half, v));
    cam.x = clamp(dragFrom.cam.x - (e.clientX - dragFrom.x) / r.width * lastCrop.fw, lastCrop.fw / 2);
    cam.y = clamp(dragFrom.cam.y - (e.clientY - dragFrom.y) / r.height * lastCrop.fh, lastCrop.fh / 2);
    refreshIfPaused();
    return;
  }
  const h = preview.getBoundingClientRect().height;
  const v = dragFrom.v + (e.clientY - dragFrom.y) / h * 2 / 0.7;   // 拖多少，人就大約移多少
  offsetEl.value = Math.max(-1, Math.min(1, v)).toFixed(2);
  showOffset();
  refreshIfPaused();
});
preview.addEventListener("pointerup", () => { dragFrom = null; });

// ===== 手動關鍵影格 =====
// 有選人、而且目前沒有跟丟，才算「正在追蹤」
function isTrackingNow() {
  return activePick >= 0 && !!target && lostSince === null;
}

// 沒在追蹤時，鏡頭該在哪裡：
// ‧ 還沒選人的片段：照這段時間裡的關鍵影格走
// ‧ 跟丟的片段：從跟丟那一刻的位置出發，照之後的關鍵影格走；沒有關鍵影格就停在原地
function manualCamAt(t) {
  const segStart = activePick < 0 ? 0 : lostSince;
  const next = picks.find(p => p.time > t + 0.001);
  const segEnd = next ? next.time : Infinity;
  const keys = keyframes.filter(k => k.t >= segStart - 0.001 && k.t < segEnd);
  const path = (activePick >= 0 && lostCam) ? [{ t: lostSince, x: lostCam.x, y: lostCam.y }, ...keys] : keys;
  if (!path.length) return null;   // 沒有關鍵影格：鏡頭維持不動
  return keyframeAt(t, path);
}

// 找出這個時間點的鏡頭位置：在兩個關鍵影格之間平滑地過渡（先慢、中間快、再慢）
function keyframeAt(t, k = keyframes) {
  if (t <= k[0].t) return k[0];
  if (t >= k[k.length - 1].t) return k[k.length - 1];
  let i = 0;
  while (k[i + 1].t < t) i++;
  const a = k[i], b = k[i + 1];
  const u = (t - a.t) / (b.t - a.t);
  const s = u * u * (3 - 2 * u);
  return { x: a.x + (b.x - a.x) * s, y: a.y + (b.y - a.y) * s };
}

function fmtTime(t) {
  const m = Math.floor(t / 60);
  return `${m}:${(t % 60).toFixed(1).padStart(4, "0")}`;
}

// 顯示關鍵影格列表：點時間跳過去，點 × 刪掉
function renderKeys() {
  const list = document.getElementById("keyList");
  list.innerHTML = (keyframes.length || picks.length) ? "" : '<span class="empty">還沒有關鍵影格</span>';
  // 選人的時間點也列出來（黑底），可以跳過去或刪掉
  picks.forEach((pk, i) => {
    const el = document.createElement("span");
    el.className = "key pick";
    el.innerHTML = `<button title="在這裡選了人">選人 ${fmtTime(pk.time)}</button><button aria-label="刪除">×</button>`;
    el.children[0].onclick = () => { video.pause(); video.currentTime = pk.time; };
    el.children[1].onclick = () => { picks.splice(i, 1); activePick = -2; syncPick(video.currentTime); renderKeys(); refreshIfPaused(); };
    list.appendChild(el);
  });
  keyframes.forEach((kf, i) => {
    const el = document.createElement("span");
    el.className = "key";
    el.innerHTML = `<button title="跳到這裡">${fmtTime(kf.t)}</button><button aria-label="刪除">×</button>`;
    el.children[0].onclick = () => { video.pause(); video.currentTime = kf.t; };
    el.children[1].onclick = () => { keyframes.splice(i, 1); renderKeys(); refreshIfPaused(); };
    list.appendChild(el);
  });
}

document.getElementById("addKey").addEventListener("click", () => {
  if (!video.videoWidth) return;
  const t = video.currentTime;
  keyframes = keyframes.filter(k => Math.abs(k.t - t) > 0.05);   // 同一個時間點就覆蓋
  keyframes.push({ t, x: cam.x, y: cam.y });
  keyframes.sort((a, b) => a.t - b.t);
  manualEdit = false;
  renderKeys();
  status.textContent = `已在 ${fmtTime(t)} 加入關鍵影格`;
});

// 播放或跳到別的時間，就結束「正在手動調整」的狀態
video.addEventListener("play", () => { manualEdit = false; });
video.addEventListener("seeked", () => {
  if (exporting) return;
  manualEdit = false;
  // 往回跳到跟丟之前的時間，就先當作還沒跟丟，重新找人
  if (lostSince !== null && video.currentTime < lostSince) { lostSince = null; lostCam = null; lostCount = 0; }
});

filterAmtEl.addEventListener("input", refreshIfPaused);

// 色溫、色調：像在畫面上蓋一層有顏色的透明玻璃紙，用「柔光」混合讓顏色自然地滲進去
function applyColorShift() {
  const temp = adj("adjTemp"), tint = adj("adjTint");
  pctx.save();
  pctx.globalCompositeOperation = "soft-light";
  if (temp !== 0) {
    // 往右偏暖（橘色），往左偏冷（藍色）
    pctx.fillStyle = temp > 0 ? "rgb(255,150,40)" : "rgb(40,130,255)";
    pctx.globalAlpha = Math.abs(temp) * 0.6;
    pctx.fillRect(0, 0, preview.width, preview.height);
  }
  if (tint !== 0) {
    // 往右偏洋紅，往左偏綠
    pctx.fillStyle = tint > 0 ? "rgb(255,40,200)" : "rgb(40,220,80)";
    pctx.globalAlpha = Math.abs(tint) * 0.5;
    pctx.fillRect(0, 0, preview.width, preview.height);
  }
  pctx.restore();
}

// 實際試畫一個紅點，看瀏覽器的畫布濾鏡有沒有作用（Safari 常常有這個屬性但沒效果）
const CANVAS_FILTER_OK = (() => {
  const c = document.createElement("canvas");
  c.width = c.height = 1;
  const x = c.getContext("2d");
  if (!("filter" in x)) return false;
  x.filter = "grayscale(1)";
  x.fillStyle = "#ff0000";
  x.fillRect(0, 0, 1, 1);
  const [r, g] = x.getImageData(0, 0, 1, 1).data;
  return Math.abs(r - g) < 20;   // 變成灰色的話，紅和綠會差不多
})();

// 「鏡頭」目前對準的位置（比例座標），會慢慢追向人的身體中心
let cam = { x: 0.5, y: 0.5 };

function renderPreview() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const zoom = parseFloat(zoomEl.value);
  const k = parseFloat(followEl.value);

  // 有在追蹤人物時跟著人；還沒開始追蹤時，照手動關鍵影格移動
  const tracking = isTrackingNow();
  if (tracking) {
    // 平滑：每一格只往目標移動一小段，數字越大跟得越快、越不平滑
    cam.x += (target.x - cam.x) * k;
    if (followYEl.checked) cam.y += (target.y - cam.y) * k;
  } else if (!manualEdit) {
    const p = manualCamAt(video.currentTime);   // 照手動關鍵影格走，沒有就停在原地
    if (p) { cam.x = p.x; cam.y = p.y; }
  }

  // 先依比例框出範圍，再依放大倍率縮小
  const b = baseCrop();
  const cw = b.w / zoom, ch = b.h / zoom;
  // 讓鏡頭中心對準人，但不能超出原影片邊界
  let cx = cam.x * vw - cw / 2;
  // 加上「人物上下位置」：數值越大，框框往上移，人就會出現在畫面比較下面
  const offset = tracking ? parseFloat(offsetEl.value) * 0.35 * ch : 0;   // 上下位置只在追蹤人物時套用
  const camY = tracking ? (followYEl.checked ? cam.y : 0.5) : cam.y;
  let cy = camY * vh - ch / 2 - offset;
  lastCrop = { fw: cw / vw, fh: ch / vh };   // 記住框框佔原影片多少，拖曳時用
  cx = Math.max(0, Math.min(vw - cw, cx));
  cy = Math.max(0, Math.min(vh - ch, cy));

  if (CANVAS_FILTER_OK) pctx.filter = filterString();   // Chrome：直接用瀏覽器的濾鏡
  pctx.drawImage(video, cx, cy, cw, ch, 0, 0, preview.width, preview.height);
  pctx.filter = "none";
  if (!CANVAS_FILTER_OK) applyFilterByPixels();   // Safari：自己算
  applyColorShift();   // 最後再調色溫、色調
}

// 身體中心（可以改成你上一步選的點）
const CENTER_IDS = [11, 12, 23, 24];
function bodyCenter(lm) {
  const x = CENTER_IDS.reduce((s, i) => s + lm[i].x, 0) / CENTER_IDS.length;
  const y = CENTER_IDS.reduce((s, i) => s + lm[i].y, 0) / CENTER_IDS.length;
  return { x, y };
}

// 兩個點之間的距離（比例座標）
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// 身體大小：肩膀中點到髖部中點的距離（軀幹長度），離鏡頭近的人大、遠的人小
function bodySize(lm) {
  const sh = { x: (lm[11].x + lm[12].x) / 2, y: (lm[11].y + lm[12].y) / 2 };
  const hp = { x: (lm[23].x + lm[24].x) / 2, y: (lm[23].y + lm[24].y) / 2 };
  return Math.max(0.02, dist(sh, hp));
}

// 要追蹤的人：記住位置、身體大小、移動方向
let target = null;   // { x, y, size, vx, vy }
function makeTarget(lm) {
  const c = bodyCenter(lm);
  // 多記住這個人「衣服的顏色」，用來分辨靠很近的不同人
  return { x: c.x, y: c.y, size: bodySize(lm), vx: 0, vy: 0, look: appearance(lm) };
}

// ===== 用衣服顏色分辨是不是同一個人 =====
// 每次偵測時，把畫面縮小存一份，從裡面取身體和大腿區域的平均顏色
const sampler = document.createElement("canvas");
const sctx = sampler.getContext("2d", { willReadFrequently: true });
let frameImg = null;
function grabFrame() {
  const w = 160, h = Math.max(1, Math.round(160 * video.videoHeight / video.videoWidth));
  sampler.width = w; sampler.height = h;
  sctx.drawImage(video, 0, 0, w, h);
  frameImg = sctx.getImageData(0, 0, w, h);
}

// 在四個關節圍成的區域裡，平均取 25 個點的顏色
function regionColor(p1, p2, p3, p4) {
  const { width: w, height: h, data } = frameImg;
  let r = 0, g = 0, b = 0, n = 0;
  for (let u = 0.1; u < 1; u += 0.2) {
    for (let v = 0.1; v < 1; v += 0.2) {
      const tx = p1.x + (p2.x - p1.x) * u, ty = p1.y + (p2.y - p1.y) * u;   // 上邊
      const bx = p4.x + (p3.x - p4.x) * u, by = p4.y + (p3.y - p4.y) * u;   // 下邊
      const x = Math.round((tx + (bx - tx) * v) * (w - 1)), y = Math.round((ty + (by - ty) * v) * (h - 1));
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const i = (y * w + x) * 4;
      r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
    }
  }
  return n ? [r / n, g / n, b / n] : null;
}

// 一個人的「樣子」：上半身（肩膀到髖部）和大腿（髖部到膝蓋）的顏色
function appearance(lm) {
  if (!frameImg) return null;
  const torso = regionColor(lm[11], lm[12], lm[24], lm[23]);
  const kneesSeen = (lm[25].visibility ?? 1) > 0.5 && (lm[26].visibility ?? 1) > 0.5;
  const legs = kneesSeen ? regionColor(lm[23], lm[24], lm[26], lm[25]) : null;
  return { torso, legs };
}

// 兩個人的顏色差多少（0 = 一模一樣，大約 0.3 以上就很不一樣）
function lookDiff(a, b) {
  if (!a || !b || !a.torso || !b.torso) return 0;
  const d = (c1, c2) => Math.hypot(c1[0] - c2[0], c1[1] - c2[1], c1[2] - c2[2]) / 441.7;
  const parts = [d(a.torso, b.torso)];
  if (a.legs && b.legs) parts.push(d(a.legs, b.legs));
  return parts.reduce((x, y) => x + y, 0) / parts.length;
}
const LOOK_LIMIT = 0.2;   // 顏色差超過這個，就不當作同一個人
// 能接受的差距：以「一個軀幹長」為單位，遠近的人都適用（取代原本固定的 0.15）
const MATCH_LIMIT = 1.0;
let lostCount = 0;   // 連續幾次沒找到人
let keyframes = [];    // 手動關鍵影格：{ t: 秒數, x, y: 鏡頭位置 }
let manualEdit = false; // 正在手動拖曳調整鏡頭（還沒存成關鍵影格）
let lastCrop = { fw: 1, fh: 1 };
// 跟丟的狀態：連續幾次都找不到才算真的跟丟，避免偶爾漏一格就亂動
const LOST_GRACE = 6;
let lostSince = null;   // 從哪個時間點開始跟丟
let lostCam = null;     // 跟丟那一刻鏡頭的位置（畫面會停在這裡）

let people = [];   // 這一格偵測到的所有人

// 在人群中找出「最像同一個人」的：
// 1. 先依他剛剛移動的方向，預測他這一格應該在哪
// 2. 比較每個人和預測位置的距離，也比較身體大小有沒有突然變很多
// 這樣兩個人靠很近時，比較不會跳到別人身上
function findTarget() {
  if (!target || people.length === 0) return -1;
  const pred = { x: target.x + target.vx, y: target.y + target.vy };
  let best = -1, bestCost = Infinity;
  people.forEach((lm, i) => {
    const moved = dist(bodyCenter(lm), pred) / target.size;               // 移動了幾個軀幹長
    const sizeDiff = Math.abs(bodySize(lm) - target.size) / target.size;  // 大小差多少
    const colorDiff = lookDiff(appearance(lm), target.look);               // 衣服顏色差多少
    if (colorDiff > LOOK_LIMIT) return;                                    // 顏色差太多，一定不是他
    const cost = moved + 0.7 * sizeDiff + 3 * colorDiff;
    if (cost < bestCost) { bestCost = cost; best = i; }
  });
  if (bestCost < MATCH_LIMIT) return best;
  // 跟丟之後：人可能已經走遠了，所以放寬距離（3 個軀幹長），
  // 但一定要衣服顏色很像，而且附近沒有其他「也很像」的人，才接回來，避免認錯
  if (lostCount > LOST_GRACE) {
    const cands = [];
    people.forEach((lm, i) => {
      const colorDiff = lookDiff(appearance(lm), target.look);
      if (colorDiff > LOOK_LIMIT * 0.75) return;
      const moved = dist(bodyCenter(lm), target) / target.size;
      if (moved < MATCH_LIMIT * 3) cands.push({ i, score: moved + 5 * colorDiff });
    });
    cands.sort((a, b) => a.score - b.score);
    if (cands.length === 1 || (cands.length > 1 && cands[1].score - cands[0].score > 0.8)) return cands[0].i;
  }
  return -1;
}

// 更新追蹤的位置：只往新位置靠近一部分，濾掉骨架的小抖動
const JITTER_SMOOTH = 0.6;   // 越小越穩，但反應越慢
function updateTarget(lm) {
  const c = bodyCenter(lm);
  const nx = target.x + (c.x - target.x) * JITTER_SMOOTH;
  const ny = target.y + (c.y - target.y) * JITTER_SMOOTH;
  target.vx = target.vx * 0.5 + (nx - target.x) * 0.5;   // 記住移動方向（也平滑過）
  target.vy = target.vy * 0.5 + (ny - target.y) * 0.5;
  target.x = nx;
  target.y = ny;
  target.size = target.size * 0.8 + bodySize(lm) * 0.2;
  // 顏色也慢慢更新（燈光會變），但只更新一點點，避免被別人帶走
  const now = appearance(lm);
  if (now && now.torso && target.look && target.look.torso) {
    const mix = (a, b) => a.map((v, i) => v * 0.95 + b[i] * 0.05);
    target.look.torso = mix(target.look.torso, now.torso);
    if (now.legs && target.look.legs) target.look.legs = mix(target.look.legs, now.legs);
  }
}

function detect() {
  const result = pose.detectForVideo(video, performance.now());
  people = result.landmarks;
  grabFrame();   // 存一份縮小的畫面，用來取衣服顏色
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 只在有選人的片段追蹤，而且只找「同一個人」，不會改跟別人
  const allowTrack = activePick >= 0;
  const idx = allowTrack ? findTarget() : -1;
  people.forEach((lm, i) => {
    const isTarget = i === idx;
    // 追蹤中的人畫粉紅色，其他人畫淡灰色
    drawer.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS,
      { color: isTarget ? "#FFFFFF" : "rgba(255,255,255,0.3)", lineWidth: isTarget ? 4 : 2 });
  });
  if (idx >= 0) {
    updateTarget(people[idx]);   // 平滑地更新位置，下一格用
    lostCount = 0;
    if (lostSince !== null) { lostSince = null; lostCam = null; status.textContent = "找回來了"; }   // 人回來了，繼續追蹤
    ctx.fillStyle = "#111111";
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(target.x * canvas.width, target.y * canvas.height, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else if (target && allowTrack) {
    lostCount++;
    target.vx = 0; target.vy = 0;   // 找不到時停在最後看到的位置，等他在附近重新出現
    if (lostCount > LOST_GRACE && lostSince === null) {
      // 真的跟丟了：畫面停在原地，可以用手動關鍵影格決定這段怎麼走
      lostSince = video.currentTime;
      lostCam = { x: cam.x, y: cam.y };
      status.textContent = `${fmtTime(lostSince)} 跟丟了：畫面會停在原地，可以加手動關鍵影格，或重新點選人物`;
    }
  }
}

// 選人：按按鈕進入選人模式，點畫面上的人
document.getElementById("pickBtn").addEventListener("click", () => {
  video.pause();
  detect();
  target = null;
  draw();
  stage.classList.add("picking");
  status.textContent = "在左邊畫面點一下想追蹤的人";
});

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const click = { x: (e.clientX - rect.left) / rect.width,
                  y: (e.clientY - rect.top) / rect.height };
  // 選離點擊位置最近的人
  let best = null, bestD = Infinity;
  people.forEach((lm) => {
    const d = dist(bodyCenter(lm), click);
    if (d < bestD) { bestD = d; best = makeTarget(lm); }   // 記住位置和身體大小
  });
  if (best) {
    // 加入一筆選人紀錄（同一個時間點就覆蓋），之後的片段就鎖定這個人
    const t = video.currentTime;
    picks = picks.filter(p => Math.abs(p.time - t) > 0.05);
    picks.push({ time: t, pos: clonePos(best) });
    picks.sort((a, b) => a.time - b.time);
    activePick = -2;          // 強制重新同步
    syncPick(t);
    cam = { x: best.x, y: best.y };   // 選好人時鏡頭直接對準，不用慢慢滑過去
    renderKeys();
    stage.classList.remove("picking");
    status.textContent = "選好了，播放看看預覽";
    setStep(3);
    draw();
    renderPreview();
  }
});

// ===== 逐格輸出影片 =====
// 不再邊播邊錄，而是一格一格處理：跳到那一格 → 偵測 → 置中、濾鏡 → 交給編碼器
// 比較慢，但每一格都一定會被處理到，輸出的影片不會卡
const FPS = 30;          // 輸出的每秒格數
// 可以在不同時間點重新選人：每一筆是 { time: 選人的時間, pos: 當時的位置 }
let picks = [];
let activePick = -1;     // 目前時間用的是第幾筆選人（-1 代表還沒選人）

// 找出某個時間點該用哪一次選人：用「時間在它之前、最近的那一次」
function pickIndexAt(t) {
  let idx = -1;
  picks.forEach((p, i) => { if (p.time <= t + 0.001) idx = i; });
  return idx;
}

// 複製一份選人紀錄（連顏色也複製，避免追蹤時改到原本的紀錄）
function clonePos(p) {
  const look = p.look ? { torso: p.look.torso && [...p.look.torso], legs: p.look.legs && [...p.look.legs] } : null;
  return { ...p, look };
}

// 換到新的選人區段時，從那次選人的位置重新開始鎖定
function syncPick(t) {
  const idx = pickIndexAt(t);
  if (idx !== activePick) {
    activePick = idx;
    target = idx >= 0 ? clonePos(picks[idx].pos) : null;
    lostCount = 0;
    lostSince = null;
    lostCam = null;
  }
}
let exporting = false;   // 輸出中時，暫停一般的預覽更新
let currentFile = null;  // 原始影片檔，拿聲音用

// 跳到某個時間，等畫面準備好再繼續（最多等 1 秒，避免卡住）
function seekTo(t) {
  return new Promise(resolve => {
    const timer = setTimeout(resolve, 1000);
    video.addEventListener("seeked", () => { clearTimeout(timer); resolve(); }, { once: true });
    video.currentTime = t;
  });
}

function start0() { return picks.length ? picks[0].time : 0; }

// 用開源套件 mp4box.js（GitHub: gpac/mp4box.js）讀出原影片裡的 AAC 聲音
async function readOriginalAAC(file) {
  const mod = await import("https://cdn.jsdelivr.net/npm/mp4box@0.5.2/+esm");
  const MP4Box = mod.createFile ? mod : mod.default;
  const buf = await file.arrayBuffer();
  const mp4 = MP4Box.createFile();
  let track = null;
  const samples = [];
  mp4.onReady = info => {
    track = info.audioTracks[0];
    if (!track || !track.codec.startsWith("mp4a")) { track = null; return; }
    mp4.setExtractionOptions(track.id, null, { nbSamples: 1000 });
    mp4.start();
  };
  mp4.onSamples = (id, user, list) => samples.push(...list);
  buf.fileStart = 0;
  mp4.appendBuffer(buf);
  mp4.flush();
  if (!track || samples.length === 0) return null;
  const sampleRate = track.audio.sample_rate, numberOfChannels = track.audio.channel_count;
  // 解碼需要的設定資料（AudioSpecificConfig）：檔案裡有就用，沒有就依取樣率和聲道自己組
  const entry = mp4.getTrackById(track.id).mdia.minf.stbl.stsd.entries[0];
  let description = entry?.esds?.esd?.descs?.[0]?.descs?.[0]?.data;
  if (!description) {
    const rates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
    const idx = Math.max(0, rates.indexOf(sampleRate));
    description = new Uint8Array([(2 << 3) | (idx >> 1), ((idx & 1) << 7) | (numberOfChannels << 3)]);
  }
  return { sampleRate, numberOfChannels, description, samples };
}

// 找瀏覽器支援的 H.264 設定（剪映、Wink 都讀得了）
async function pickVideoConfig(w, h) {
  for (const codec of ["avc1.640028", "avc1.4d0028", "avc1.42e028"]) {
    const cfg = { codec, width: w, height: h, bitrate: 8_000_000, framerate: FPS };
    if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg;
  }
  return null;
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  if (!picks.length && !keyframes.length) { status.textContent = "請先點選要追蹤的人，或加入手動關鍵影格"; return; }
  if (exporting) return;
  if (!("VideoEncoder" in window)) { status.textContent = "這個瀏覽器不支援逐格輸出，請用新版 Chrome"; return; }
  exporting = true;
  video.pause();
  setStep(4);
  document.body.classList.add("exporting");
  document.getElementById("download").hidden = true;

  const W = preview.width, H = preview.height;
  const vcfg = await pickVideoConfig(W, H);
  if (!vcfg) { status.textContent = "找不到可用的影片編碼設定"; exporting = false; return; }

  // 1. 把原影片的聲音解出來，準備編成 AAC（mp4 常用的聲音格式）
  let audioBuf = null, acfg = null;
  try {
    const actx = new AudioContext();
    audioBuf = await actx.decodeAudioData(await currentFile.arrayBuffer());
    actx.close();
    const cfg = { codec: "mp4a.40.2", sampleRate: audioBuf.sampleRate,
                  numberOfChannels: Math.min(2, audioBuf.numberOfChannels), bitrate: 128_000 };
    if ((await AudioEncoder.isConfigSupported(cfg)).supported) acfg = cfg;
  } catch (err) { console.warn("無法重新編碼聲音", err); }

  // Safari 沒有聲音編碼器時：直接把原影片裡已經編好的 AAC 聲音搬過來，不重新編碼
  let aacCopy = null;
  if (!acfg) {
    try { aacCopy = await readOriginalAAC(currentFile, start0()); }
    catch (err) { console.warn("無法直接複製原本的聲音", err); }
  }

  // 2. 準備 mp4 封裝器（開源套件 mp4-muxer）和影片編碼器
  const muxer = new Muxer({
    target: new ArrayBufferTarget(),
    video: { codec: "avc", width: W, height: H },
    audio: acfg ? { codec: "aac", sampleRate: acfg.sampleRate, numberOfChannels: acfg.numberOfChannels }
         : aacCopy ? { codec: "aac", sampleRate: aacCopy.sampleRate, numberOfChannels: aacCopy.numberOfChannels }
         : undefined,
    fastStart: "in-memory",
    firstTimestampBehavior: "offset",   // 聲音的第一格如果不是剛好從 0 開始，自動對齊
  });
  const venc = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: e => console.error(e),
  });
  venc.configure(vcfg);

  // 3. 一格一格處理
  // 有手動關鍵影格就從頭輸出；沒有的話，跟以前一樣從點選人物的時間點開始
  const start = keyframes.length ? 0 : picks[0].time;
  manualEdit = false;
  activePick = -2;           // 從頭重新同步選人和追蹤狀態
  syncPick(start);
  const firstCam = activePick >= 0 ? picks[activePick].pos : (manualCamAt(start) || { x: 0.5, y: 0.5 });
  cam = { x: firstCam.x, y: firstCam.y };
  const total = Math.floor((video.duration - start) * FPS);
  for (let i = 0; i < total; i++) {
    const t = start + i / FPS;
    await seekTo(t);
    syncPick(t);   // 依時間切換到對應的選人片段
    if (activePick >= 0 && i % DETECT_EVERY === 0) { detect(); draw(); }
    renderPreview();
    const frame = new VideoFrame(preview, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    venc.encode(frame, { keyFrame: i % (FPS * 2) === 0 });   // 每 2 秒放一個關鍵格，剪輯軟體拖拉比較順
    frame.close();
    const pct = Math.round((i + 1) / total * 100);
    status.textContent = `輸出中 ${pct}%`;
    document.getElementById("progressBar").style.width = pct + "%";   // 進度條
  }
  await venc.flush();

  // 4. 聲音：從選人的時間點切出對應長度，分段編碼
  if (acfg) {
    const aenc = new AudioEncoder({
      output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
      error: e => console.error(e),
    });
    aenc.configure(acfg);
    const sr = audioBuf.sampleRate, ch = acfg.numberOfChannels;
    const s0 = Math.floor(start * sr);
    const s1 = Math.min(audioBuf.length, s0 + Math.floor(total / FPS * sr));
    const CHUNK = 4096;
    for (let pos = s0; pos < s1; pos += CHUNK) {
      const n = Math.min(CHUNK, s1 - pos);
      const data = new Float32Array(n * ch);
      for (let c = 0; c < ch; c++) data.set(audioBuf.getChannelData(c).subarray(pos, pos + n), c * n);
      const ad = new AudioData({ format: "f32-planar", sampleRate: sr, numberOfFrames: n,
                                 numberOfChannels: ch, timestamp: Math.round((pos - s0) / sr * 1e6), data });
      aenc.encode(ad);
      ad.close();
    }
    await aenc.flush();
  } else if (aacCopy) {
    // 搬原本的聲音：只留選人時間點之後、影片長度以內的片段，時間改成從 0 開始
    const end = start + total / FPS;
    let first = true;
    for (const smp of aacCopy.samples) {
      const t = smp.cts / smp.timescale;
      if (t < start || t >= end) continue;
      const meta = first ? { decoderConfig: { codec: "mp4a.40.2", sampleRate: aacCopy.sampleRate,
                                              numberOfChannels: aacCopy.numberOfChannels, description: aacCopy.description } } : undefined;
      muxer.addAudioChunkRaw(new Uint8Array(smp.data), "key", Math.round((t - start) * 1e6),
                             Math.round(smp.duration / smp.timescale * 1e6), meta);
      first = false;
    }
  }

  // 5. 封裝成 mp4，產生下載連結
  muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: "video/mp4" });
  const link = document.getElementById("download");
  link.href = URL.createObjectURL(blob);
  link.download = "置中影片.mp4";
  link.hidden = false;
  status.textContent = (acfg || aacCopy) ? "輸出完成！" : "輸出完成（這支影片的聲音讀不到，輸出的是無聲版本）";
  exporting = false;
  document.body.classList.remove("exporting");
  setStep(5);
});

// 每一格影片畫面都更新預覽，但偵測姿勢比較花時間，每隔幾格才做一次
// 反正鏡頭本來就會平滑移動，不用每一格都知道人在哪裡
const DETECT_EVERY = 2;   // 每 2 格偵測一次；還是卡的話可以改成 3
let frameCount = 0;
function onVideoFrame() {
  if (exporting) { video.requestVideoFrameCallback(onVideoFrame); return; }   // 輸出中交給逐格流程處理
  syncPick(video.currentTime);   // 進入新的選人片段時，重新鎖定那次選的人
  frameCount++;
  if (frameCount % DETECT_EVERY === 0 || people.length === 0) {
    detect();
    draw();
  }
  renderPreview();
  video.requestVideoFrameCallback(onVideoFrame);   // 等下一格影片畫面出現再呼叫
}
video.requestVideoFrameCallback(onVideoFrame);
renderKeys();   // 一開始先顯示「還沒有關鍵影格」
</script>
</body>
</html>
