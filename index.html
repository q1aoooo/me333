<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ME<333｜跳舞影片自動置中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== 風格：黑白小誌感 + 灰色波點 + 星號與翅膀 ===== */
  :root {
    --paper: #FFFFFF;
    --ink: #111111;        /* 主色：黑 */
    --muted: #6E6E6E;      /* 次要文字：灰 */
    --dot: #D6D6D6;        /* 背景波點 */
    --soft: #F2F2F2;       /* 淺灰底 */
    --accent: #111111;     /* 想加一點顏色的話，改這裡就好（例如淡粉 #F7C6D9） */
    --shadow: 4px 4px 0 var(--ink);   /* 像貼紙一樣的硬陰影 */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 15px; line-height: 1.6;
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px);   /* 波點 */
    background-size: 22px 22px;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }

  /* ===== 上方 ===== */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 32px 6px; max-width: 1500px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .wordmark {
    margin: 0; font-family: "Anton", "Impact", sans-serif; font-weight: 400;
    font-size: 46px; line-height: 1; letter-spacing: 0.01em;
  }
  .wordmark sup { font-size: 0.55em; vertical-align: 0.9em; margin-left: 1px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  #status {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 999px;
    padding: 5px 14px; font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  body.exporting #status { background: var(--ink); color: var(--paper); }

  /* 步驟列 */
  .topbar { display: flex; align-items: center; justify-content: flex-start; gap: 12px 20px; flex-wrap: wrap;
            margin: 14px auto 22px; padding: 0 32px; max-width: 1500px; }
  .steps { list-style: none; display: flex; gap: 10px; flex-wrap: wrap; margin: 0; padding: 0; }
  .steps li {
    display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px;
    border-radius: 999px; background: var(--paper); border: 2px solid var(--ink);
    font-size: 14px; font-weight: 500; color: var(--muted);
  }
  .steps li span {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid var(--ink); color: var(--ink); font-weight: 700; font-size: 12px;
  }
  .steps li.now { background: var(--ink); color: var(--paper); box-shadow: var(--shadow); }
  .steps li.now span { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .steps li.done span { background: var(--ink); color: var(--paper); }
  .steps li.done::after { content: "*"; font-family: "Anton", sans-serif; color: var(--ink); }

  /* ===== 主要區域 ===== */
  /* 版面：上面一排工具，下面兩張一樣大的小卡，右邊設定面板 */
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 340px;
    column-gap: 36px; row-gap: 18px;
    padding: 0 32px 48px; align-items: start; max-width: 1500px; margin: 0 auto;
  }
  .toolbar { display: none; align-items: center; gap: 10px; padding-left: 20px; border-left: 2px dotted var(--ink); }   /* 用點點線和步驟分開 */
  body.has-video .toolbar { display: flex; }
  .toolbar #fileName { margin-left: 6px; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside { grid-column: 3; }

  /* 兩張小卡：同樣的白框、黑邊、硬陰影、下方標籤 */
  .frame {
    display: none; margin: 0; justify-self: center; width: fit-content; max-width: 100%;
    background: var(--paper); padding: 12px 12px 42px; position: relative;
    border: 2px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow);
  }
  body.has-video .frame { display: block; }
  .frame figcaption {
    position: absolute; left: 14px; right: 14px; bottom: 10px;
    display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 700;
  }
  .frame figcaption b { font-family: "Anton", sans-serif; font-weight: 400; font-size: 16px; letter-spacing: .02em; }
  /* 兩邊的畫面用同一個最大高度，大小就會一樣 */
  .frame video, .frame #preview { display: block; width: auto; height: auto; max-width: 100%; max-height: max(420px, calc(100vh - 250px));   /* 讓整張小卡在一個畫面內看得完 */ border-radius: 8px; background: #111; }

  /* 還沒選影片時：拖放區 */
  #dropzone {
    grid-column: 1 / 3; min-height: 60vh; border: 2px dashed var(--ink); border-radius: 18px;
    background: var(--paper); display: grid; place-content: center; text-align: center;
    padding: 40px; cursor: pointer;
  }
  #dropzone.over { background: var(--soft); border-style: solid; }
  #dropzone strong { display: block; font-size: 24px; font-weight: 900; margin-bottom: 4px; }
  #dropzone .pick { justify-self: center; margin: 18px 0 12px; }
  #dropzone small { color: var(--muted); }
  body:not(.ready) #dropzone { opacity: .5; pointer-events: none; }
  body.has-video #dropzone { display: none; }
  body:not(.has-video) aside { opacity: .4; pointer-events: none; }

  .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; min-height: 38px; }
  .pane-head h2 { margin: 0; font-size: 16px; font-weight: 900; background: var(--paper); padding: 0 4px; }
  #fileName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 原始畫面 */
  /* 原始畫面也跟著影片大小，和右邊的小卡一樣不留黑邊 */
  #stage { position: relative; border-radius: 8px; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #stage.picking canvas { pointer-events: auto; cursor: crosshair; }
  #stage.picking { box-shadow: var(--shadow); outline: 3px dashed var(--ink); outline-offset: 4px; }


  /* ===== 右側設定面板 ===== */
  aside {
    position: sticky; top: 20px; background: var(--paper); border: 2px solid var(--ink);
    border-radius: 16px; box-shadow: var(--shadow); padding: 4px 22px 20px;
    max-height: calc(100vh - 40px); overflow-y: auto;
  }
  aside section { padding: 14px 0; border-bottom: 2px dotted var(--ink); }
  aside section:last-child { border-bottom: 0; padding-bottom: 0; }
  aside h3 { margin: 0 0 8px; font-size: 15px; font-weight: 900; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; margin: 4px 0; }
  .row output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .row input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 6px 0 8px; }
  input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: var(--dot); cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
  input.bipolar {   /* 中間 0 的刻度 */
    background: linear-gradient(to right, var(--dot) calc(50% - 1px), var(--ink) calc(50% - 1px),
                var(--ink) calc(50% + 1px), var(--dot) calc(50% + 1px));
  }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .check input { accent-color: var(--ink); width: 16px; height: 16px; }

  /* 濾鏡選項 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label {
    display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px;
    border: 2px solid var(--ink); border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .chips label i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--ink); }
  .chips input:checked + label { background: var(--ink); color: var(--paper); }
  .chips input:checked + label i { border-color: var(--paper); }
  .chips input:focus-visible + label { outline: 3px dashed var(--ink); outline-offset: 2px; }
  #filterWarn { color: var(--ink); font-size: 13px; font-weight: 700; }

  /* 按鈕 */
  .btn {
    border: 2px solid var(--ink); background: var(--paper); border-radius: 999px;
    padding: 6px 16px; cursor: pointer; font-weight: 700;
  }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--dot); }
  .btn.primary:hover { background: #2a2a2a; }
  .btn.primary:active { transform: translate(2px, 2px); box-shadow: none; }
  .btn.big { width: 100%; padding: 12px; font-size: 17px; }
  .btn.small { padding: 3px 12px; font-size: 13px; }
  body.exporting #exportBtn { opacity: .5; pointer-events: none; }

  /* 輸出進度 */
  .progress { height: 10px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; margin-top: 12px; display: none; }
  body.exporting .progress { display: block; }
  #progressBar { height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  #download { display: block; text-align: center; margin-top: 12px; text-decoration: none; }
  #download[hidden] { display: none; }
  .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

  /* ===== 小螢幕 ===== */
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr 1fr; }
    aside { grid-column: 1 / -1; grid-row: auto; position: static; max-height: none; }
  }
  @media (max-width: 700px) {
    header, .topbar, main { padding-left: 16px; padding-right: 16px; }
    main { grid-template-columns: 1fr; }
    .toolbar { flex-wrap: wrap; }
    #dropzone { grid-column: 1; }
      .wordmark { font-size: 38px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div>
        <h1 class="wordmark">ME&lt;333<sup>*</sup></h1>
        <p>跳舞影片自動把你放在畫面中間</p>
      </div>
    </div>
    <div id="status" role="status">模型載入中…</div>
  </header>

  <!-- 步驟和工具按鈕放在同一行 -->
  <div class="topbar">
    <ol class="steps">
      <li class="now"><span>1</span>選影片</li>
      <li><span>2</span>點選自己</li>
      <li><span>3</span>調整畫面</li>
      <li><span>4</span>輸出</li>
    </ol>
    <div class="toolbar">
      <button id="pickBtn" class="btn">點選我自己</button>
      <label for="picker" class="btn">換一支影片</label>
      <span id="fileName"></span>
    </div>
  </div>

  <main>
    <!-- 還沒選影片時的拖放區 -->
    <label id="dropzone" for="picker">
      <strong>把跳舞影片拖進來 *</strong>
      <span>多人一起跳也可以，等一下點選你自己就好</span>
      <span class="btn primary pick">選擇影片</span>
      <small>影片只在你的電腦上處理，不會上傳到任何地方</small>
    </label>
    <input type="file" id="picker" accept="video/*" hidden>

    <!-- 原始畫面 -->
    <figure class="frame source">
      <div id="stage">
        <video id="video" controls playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <figcaption><span>原始畫面</span><b>ME</b></figcaption>
    </figure>

    <figure class="frame result">
      <canvas id="preview"></canvas>
      <figcaption><span>置中預覽</span><b>&lt;333*</b></figcaption>
    </figure>

    <!-- 設定面板 -->
    <aside>
      <section>
        <h3>追蹤</h3>
        <div class="row"><label for="zoom">放大倍率</label><output id="zoomVal">1.15</output>
          <input type="range" id="zoom" min="1" max="2" step="0.05" value="1.15"></div>
        <div class="row"><label for="follow">跟隨速度</label><output id="followVal">0.26</output>
          <input type="range" id="follow" min="0.02" max="0.5" step="0.01" value="0.26"></div>
        <label class="check"><input type="checkbox" id="followY" checked> 上下也跟隨</label>
      </section>

      <section>
        <h3>濾鏡</h3>
        <div class="chips">
          <input type="radio" name="filter" id="f-none" value="none" checked><label for="f-none"><i style="background:#D9D4E6"></i>原色</label>
          <input type="radio" name="filter" id="f-fresh" value="fresh"><label for="f-fresh"><i style="background:#7FDCC2"></i>清新</label>
          <input type="radio" name="filter" id="f-warm" value="warm"><label for="f-warm"><i style="background:#FFB25E"></i>暖色</label>
          <input type="radio" name="filter" id="f-cool" value="cool"><label for="f-cool"><i style="background:#7FA8FF"></i>冷色</label>
          <input type="radio" name="filter" id="f-retro" value="retro"><label for="f-retro"><i style="background:#B98E6B"></i>復古</label>
          <input type="radio" name="filter" id="f-bw" value="bw"><label for="f-bw"><i style="background:#232544"></i>黑白</label>
        </div>
        <div class="row"><label for="filterAmt">濾鏡強度</label><output id="filterAmtVal">0.7</output>
          <input type="range" id="filterAmt" min="0" max="1" step="0.05" value="0.7"></div>
        <span id="filterWarn"></span>
      </section>

      <section>
        <div class="pane-head" style="min-height:0; margin-bottom:4px">
          <h3 style="margin:0">調整</h3>
          <button id="resetAdj" class="btn small">重設</button>
        </div>
        <div class="row"><label for="adjExposure">曝光</label><output id="adjExposureVal">0</output>
          <input type="range" class="bipolar" id="adjExposure" min="-1" max="1" step="0.05" value="0"></div>
        <div class="row"><label for="adjContrast">對比</label><output id="adjContrastVal">0</output>
          <input type="range" class="bipolar" id="adjContrast" min="-1" max="1" step="0.05" value="0"></div>
        <div class="row"><label for="adjTemp">色溫</label><output id="adjTempVal">0</output>
          <input type="range" class="bipolar" id="adjTemp" min="-1" max="1" step="0.05" value="0"></div>
        <div class="row"><label for="adjTint">色調</label><output id="adjTintVal">0</output>
          <input type="range" class="bipolar" id="adjTint" min="-1" max="1" step="0.05" value="0"></div>
      </section>

      <section>
        <button id="exportBtn" class="btn primary big">輸出影片</button>
        <div class="progress"><div id="progressBar"></div></div>
        <a id="download" class="btn" hidden>下載置中影片</a>
        <p class="note">從你點選自己的那一刻開始輸出到結尾，會一格一格處理，請等進度跑完。</p>
      </section>
    </aside>
  </main>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
// 開源套件 mp4-muxer（GitHub: Vanilagy/mp4-muxer），把編好的畫面和聲音包成 mp4
import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm";

const video  = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx    = canvas.getContext("2d");
const status = document.getElementById("status");
const stage  = document.getElementById("stage");
const drawer = new DrawingUtils(ctx);

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
const pose = await PoseLandmarker.createFromOptions(vision, {
  baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
    delegate: "GPU",   // 用顯示卡來跑偵測，比較快
  },
  runningMode: "VIDEO",
  numPoses: 3,   // 最多同時偵測 3 個人
});
status.textContent = "準備好了";
document.body.classList.add("ready");

// 選檔和拖曳進來都走同一個函式
function loadFile(file) {
  if (!file || !file.type.startsWith("video")) { status.textContent = "請選擇影片檔"; return; }
  video.src = URL.createObjectURL(file);
  currentFile = file;   // 記住原始檔，輸出時要拿聲音
  target = null; picked = null;
  document.body.classList.add("has-video");
  document.getElementById("fileName").textContent = file.name;
  document.getElementById("download").hidden = true;
  setStep(2);
  status.textContent = "暫停在看得到你的畫面，按「點選我自己」";
}
document.getElementById("picker").addEventListener("change", e => loadFile(e.target.files[0]));
const drop = document.getElementById("dropzone");
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => loadFile(e.dataTransfer.files[0]));

// 上方步驟列：目前走到第幾步
function setStep(n) {
  document.querySelectorAll(".steps li").forEach((li, i) => {
    li.classList.toggle("done", i + 1 < n);
    li.classList.toggle("now", i + 1 === n);
  });
}

video.addEventListener("loadedmetadata", () => {
  // iPhone 常拍 4K，每格都處理 4K 太吃力；長邊最多縮到 1920（也就是 1080p）
  const scale = Math.min(1, 1920 / Math.max(video.videoWidth, video.videoHeight));
  // H.264 要求寬高是偶數
  const w = Math.round(video.videoWidth * scale / 2) * 2, h = Math.round(video.videoHeight * scale / 2) * 2;
  canvas.width = w;  canvas.height = h;
  preview.width = w; preview.height = h;
  cam = { x: 0.5, y: 0.5 };
});

// ===== 置中預覽 =====
const preview = document.getElementById("preview");
const pctx = preview.getContext("2d");
const zoomEl = document.getElementById("zoom");
const followEl = document.getElementById("follow");
const followYEl = document.getElementById("followY");
zoomEl.oninput = () => document.getElementById("zoomVal").textContent = zoomEl.value;
followEl.oninput = () => document.getElementById("followVal").textContent = followEl.value;

// ===== 濾鏡 =====
// 每個濾鏡由幾個調整組成：亮度、對比、飽和度、棕褐色、色相旋轉（度）、黑白
const PRESETS = {
  none:  { brightness: 1,    contrast: 1,    saturate: 1,    sepia: 0,    hue: 0,   gray: 0 },
  fresh: { brightness: 1.08, contrast: 1.03, saturate: 1.25, sepia: 0,    hue: 0,   gray: 0 },
  warm:  { brightness: 1.03, contrast: 1.02, saturate: 1.1,  sepia: 0.25, hue: -8,  gray: 0 },
  cool:  { brightness: 1.0,  contrast: 1.06, saturate: 0.9,  sepia: 0,    hue: 12,  gray: 0 },
  retro: { brightness: 1.02, contrast: 0.95, saturate: 0.7,  sepia: 0.45, hue: 0,   gray: 0 },
  bw:    { brightness: 1.02, contrast: 1.25, saturate: 1,    sepia: 0,    hue: 0,   gray: 1 },
};
// 濾鏡改成一排可以點的選項
function currentFilter() { return document.querySelector('input[name="filter"]:checked').value; }
const filterAmtEl = document.getElementById("filterAmt");
filterAmtEl.oninput = () => document.getElementById("filterAmtVal").textContent = filterAmtEl.value;

// 依強度在「原色」和「選的濾鏡」之間取中間值，組成瀏覽器看得懂的濾鏡字串
function filterString() {
  const p = PRESETS[currentFilter()], o = PRESETS.none;
  const k = parseFloat(filterAmtEl.value);
  const mix = key => o[key] + (p[key] - o[key]) * k;
  // 曝光和對比：乘在濾鏡的亮度、對比上（滑桿 -1～1 對應 0.5 倍～1.5 倍）
  const exposure = 1 + adj("adjExposure") * 0.5;
  const contrast = 1 + adj("adjContrast") * 0.5;
  return `brightness(${mix("brightness") * exposure}) contrast(${mix("contrast") * contrast}) saturate(${mix("saturate")}) ` +
         `sepia(${mix("sepia")}) hue-rotate(${mix("hue")}deg) grayscale(${mix("gray")})`;
}

// ===== 手動調整 =====
const ADJ_IDS = ["adjExposure", "adjContrast", "adjTemp", "adjTint"];
function adj(id) { return parseFloat(document.getElementById(id).value); }

// 暫停時調整，也要立刻更新預覽，才看得到效果
function refreshIfPaused() { if (video.paused) renderPreview(); }

ADJ_IDS.forEach(id => {
  const el = document.getElementById(id);
  el.oninput = () => { document.getElementById(id + "Val").textContent = el.value; refreshIfPaused(); };
});
document.getElementById("resetAdj").onclick = () => {
  ADJ_IDS.forEach(id => { document.getElementById(id).value = 0; document.getElementById(id + "Val").textContent = "0"; });
  refreshIfPaused();
};
document.querySelectorAll('input[name="filter"]').forEach(r => r.onchange = refreshIfPaused);
filterAmtEl.addEventListener("input", refreshIfPaused);

// 色溫、色調：像在畫面上蓋一層有顏色的透明玻璃紙，用「柔光」混合讓顏色自然地滲進去
function applyColorShift() {
  const temp = adj("adjTemp"), tint = adj("adjTint");
  pctx.save();
  pctx.globalCompositeOperation = "soft-light";
  if (temp !== 0) {
    // 往右偏暖（橘色），往左偏冷（藍色）
    pctx.fillStyle = temp > 0 ? "rgb(255,150,40)" : "rgb(40,130,255)";
    pctx.globalAlpha = Math.abs(temp) * 0.6;
    pctx.fillRect(0, 0, preview.width, preview.height);
  }
  if (tint !== 0) {
    // 往右偏洋紅，往左偏綠
    pctx.fillStyle = tint > 0 ? "rgb(255,40,200)" : "rgb(40,220,80)";
    pctx.globalAlpha = Math.abs(tint) * 0.5;
    pctx.fillRect(0, 0, preview.width, preview.height);
  }
  pctx.restore();
}

// 有些舊版瀏覽器的畫布不支援濾鏡，先提醒
if (!("filter" in pctx)) {
  document.getElementById("filterWarn").textContent = "這個瀏覽器不支援濾鏡，請改用新版 Chrome";
}

// 「鏡頭」目前對準的位置（比例座標），會慢慢追向人的身體中心
let cam = { x: 0.5, y: 0.5 };

function renderPreview() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const zoom = parseFloat(zoomEl.value);
  const k = parseFloat(followEl.value);

  // 平滑：每一格只往目標移動一小段，數字越大跟得越快、越不平滑
  if (target) {
    cam.x += (target.x - cam.x) * k;
    if (followYEl.checked) cam.y += (target.y - cam.y) * k;
  }

  // 放大後要擷取的範圍（寬高都縮小成 1/zoom）
  const cw = vw / zoom, ch = vh / zoom;
  // 讓鏡頭中心對準人，但不能超出原影片邊界
  let cx = cam.x * vw - cw / 2;
  let cy = (followYEl.checked ? cam.y : 0.5) * vh - ch / 2;
  cx = Math.max(0, Math.min(vw - cw, cx));
  cy = Math.max(0, Math.min(vh - ch, cy));

  pctx.filter = filterString();   // 套上濾鏡
  pctx.drawImage(video, cx, cy, cw, ch, 0, 0, preview.width, preview.height);
  pctx.filter = "none";
  applyColorShift();   // 最後再調色溫、色調
}

// 身體中心（可以改成你上一步選的點）
const CENTER_IDS = [11, 12, 23, 24];
function bodyCenter(lm) {
  const x = CENTER_IDS.reduce((s, i) => s + lm[i].x, 0) / CENTER_IDS.length;
  const y = CENTER_IDS.reduce((s, i) => s + lm[i].y, 0) / CENTER_IDS.length;
  return { x, y };
}

// 兩個點之間的距離（比例座標）
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// 要追蹤的人：記住他上一格的身體中心
let target = null;
// 一格之內最多能移動多遠，超過就當作「跟丟了」
const MAX_JUMP = 0.15;

let people = [];   // 這一格偵測到的所有人

// 在人群中找出離 target 最近的那個人
function findTarget() {
  if (!target || people.length === 0) return -1;
  let best = -1, bestD = Infinity;
  people.forEach((lm, i) => {
    const d = dist(bodyCenter(lm), target);
    if (d < bestD) { bestD = d; best = i; }
  });
  return bestD < MAX_JUMP ? best : -1;
}

function detect() {
  const result = pose.detectForVideo(video, performance.now());
  people = result.landmarks;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const idx = findTarget();
  people.forEach((lm, i) => {
    const isTarget = i === idx;
    // 追蹤中的人畫粉紅色，其他人畫淡灰色
    drawer.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS,
      { color: isTarget ? "#FFFFFF" : "rgba(255,255,255,0.3)", lineWidth: isTarget ? 4 : 2 });
  });
  if (idx >= 0) {
    target = bodyCenter(people[idx]);   // 更新位置，下一格用
    ctx.fillStyle = "#111111";
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(target.x * canvas.width, target.y * canvas.height, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else if (target) {
    status.textContent = "這一格跟丟了，可以暫停後重新選人";
  }
}

// 選人：按按鈕進入選人模式，點畫面上的人
document.getElementById("pickBtn").addEventListener("click", () => {
  video.pause();
  detect();
  target = null;
  draw();
  stage.classList.add("picking");
  status.textContent = "在左邊畫面點一下你自己";
});

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const click = { x: (e.clientX - rect.left) / rect.width,
                  y: (e.clientY - rect.top) / rect.height };
  // 選離點擊位置最近的人
  let best = null, bestD = Infinity;
  people.forEach((lm) => {
    const d = dist(bodyCenter(lm), click);
    if (d < bestD) { bestD = d; best = bodyCenter(lm); }
  });
  if (best) {
    target = best;
    cam = { ...best };   // 選好人時鏡頭直接對準，不用慢慢滑過去
    picked = { time: video.currentTime, pos: { ...best } };   // 記住在哪個時間點選了誰，輸出時從這裡開始
    stage.classList.remove("picking");
    status.textContent = "選好了，播放看看預覽";
    setStep(3);
    draw();
    renderPreview();
  }
});

// ===== 逐格輸出影片 =====
// 不再邊播邊錄，而是一格一格處理：跳到那一格 → 偵測 → 置中、濾鏡 → 交給編碼器
// 比較慢，但每一格都一定會被處理到，輸出的影片不會卡
const FPS = 30;          // 輸出的每秒格數
let picked = null;       // { time: 選人的時間, pos: 當時的位置 }
let exporting = false;   // 輸出中時，暫停一般的預覽更新
let currentFile = null;  // 原始影片檔，拿聲音用

// 跳到某個時間，等畫面準備好再繼續（最多等 1 秒，避免卡住）
function seekTo(t) {
  return new Promise(resolve => {
    const timer = setTimeout(resolve, 1000);
    video.addEventListener("seeked", () => { clearTimeout(timer); resolve(); }, { once: true });
    video.currentTime = t;
  });
}

// 找瀏覽器支援的 H.264 設定（剪映、Wink 都讀得了）
async function pickVideoConfig(w, h) {
  for (const codec of ["avc1.640028", "avc1.4d0028", "avc1.42e028"]) {
    const cfg = { codec, width: w, height: h, bitrate: 8_000_000, framerate: FPS };
    if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg;
  }
  return null;
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  if (!picked) { status.textContent = "請先選擇要追蹤的人"; return; }
  if (exporting) return;
  if (!("VideoEncoder" in window)) { status.textContent = "這個瀏覽器不支援逐格輸出，請用新版 Chrome"; return; }
  exporting = true;
  video.pause();
  setStep(4);
  document.body.classList.add("exporting");
  document.getElementById("download").hidden = true;

  const W = preview.width, H = preview.height;
  const vcfg = await pickVideoConfig(W, H);
  if (!vcfg) { status.textContent = "找不到可用的影片編碼設定"; exporting = false; return; }

  // 1. 把原影片的聲音解出來，準備編成 AAC（mp4 常用的聲音格式）
  let audioBuf = null, acfg = null;
  try {
    const actx = new AudioContext();
    audioBuf = await actx.decodeAudioData(await currentFile.arrayBuffer());
    actx.close();
    const cfg = { codec: "mp4a.40.2", sampleRate: audioBuf.sampleRate,
                  numberOfChannels: Math.min(2, audioBuf.numberOfChannels), bitrate: 128_000 };
    if ((await AudioEncoder.isConfigSupported(cfg)).supported) acfg = cfg;
  } catch (err) { console.warn("讀不到聲音", err); }

  // 2. 準備 mp4 封裝器（開源套件 mp4-muxer）和影片編碼器
  const muxer = new Muxer({
    target: new ArrayBufferTarget(),
    video: { codec: "avc", width: W, height: H },
    audio: acfg ? { codec: "aac", sampleRate: acfg.sampleRate, numberOfChannels: acfg.numberOfChannels } : undefined,
    fastStart: "in-memory",
  });
  const venc = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: e => console.error(e),
  });
  venc.configure(vcfg);

  // 3. 一格一格處理：從選人的時間點開始，到影片結尾
  target = { ...picked.pos };
  cam = { ...picked.pos };
  const start = picked.time;
  const total = Math.floor((video.duration - start) * FPS);
  for (let i = 0; i < total; i++) {
    await seekTo(start + i / FPS);
    if (i % DETECT_EVERY === 0) { detect(); draw(); }
    renderPreview();
    const frame = new VideoFrame(preview, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    venc.encode(frame, { keyFrame: i % (FPS * 2) === 0 });   // 每 2 秒放一個關鍵格，剪輯軟體拖拉比較順
    frame.close();
    const pct = Math.round((i + 1) / total * 100);
    status.textContent = `輸出中 ${pct}%`;
    document.getElementById("progressBar").style.width = pct + "%";   // 進度條
  }
  await venc.flush();

  // 4. 聲音：從選人的時間點切出對應長度，分段編碼
  if (acfg) {
    const aenc = new AudioEncoder({
      output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
      error: e => console.error(e),
    });
    aenc.configure(acfg);
    const sr = audioBuf.sampleRate, ch = acfg.numberOfChannels;
    const s0 = Math.floor(start * sr);
    const s1 = Math.min(audioBuf.length, s0 + Math.floor(total / FPS * sr));
    const CHUNK = 4096;
    for (let pos = s0; pos < s1; pos += CHUNK) {
      const n = Math.min(CHUNK, s1 - pos);
      const data = new Float32Array(n * ch);
      for (let c = 0; c < ch; c++) data.set(audioBuf.getChannelData(c).subarray(pos, pos + n), c * n);
      const ad = new AudioData({ format: "f32-planar", sampleRate: sr, numberOfFrames: n,
                                 numberOfChannels: ch, timestamp: Math.round((pos - s0) / sr * 1e6), data });
      aenc.encode(ad);
      ad.close();
    }
    await aenc.flush();
  }

  // 5. 封裝成 mp4，產生下載連結
  muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: "video/mp4" });
  const link = document.getElementById("download");
  link.href = URL.createObjectURL(blob);
  link.download = "置中影片.mp4";
  link.hidden = false;
  status.textContent = acfg ? "輸出完成！" : "輸出完成（這支影片的聲音讀不到，輸出的是無聲版本）";
  exporting = false;
  document.body.classList.remove("exporting");
  setStep(5);
});

// 每一格影片畫面都更新預覽，但偵測姿勢比較花時間，每隔幾格才做一次
// 反正鏡頭本來就會平滑移動，不用每一格都知道人在哪裡
const DETECT_EVERY = 2;   // 每 2 格偵測一次；還是卡的話可以改成 3
let frameCount = 0;
function onVideoFrame() {
  if (exporting) { video.requestVideoFrameCallback(onVideoFrame); return; }   // 輸出中交給逐格流程處理
  frameCount++;
  if (frameCount % DETECT_EVERY === 0 || people.length === 0) {
    detect();
    draw();
  }
  renderPreview();
  video.requestVideoFrameCallback(onVideoFrame);   // 等下一格影片畫面出現再呼叫
}
video.requestVideoFrameCallback(onVideoFrame);
</script>
</body>
</html>
